<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>表单模板预览 - standard - 场地预约后台</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f8fafc;color:#0f172a;display:flex;min-height:100vh}
a{text-decoration:none;color:inherit}
.sidebar{width:220px;background:#fff;border-right:1px solid #e2e8f0;position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column}
.sidebar-brand{height:56px;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid #e2e8f0;font-weight:600;font-size:15px}
.sidebar-brand .logo{width:28px;height:28px;border-radius:7px;background:#4f46e5;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.sidebar-nav{flex:1;padding:12px 8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:6px;font-size:13.5px;color:#64748b;margin-bottom:2px}
.nav-item:hover{background:#f1f5f9;color:#0f172a}
.nav-item.active{background:#eef2ff;color:#4f46e5;font-weight:500}
.nav-icon{width:20px;text-align:center;font-size:15px}
.sidebar-footer{padding:12px 20px;border-top:1px solid #e2e8f0}
.sidebar-footer a{color:#64748b;font-size:12px}
.main{margin-left:220px;flex:1}
.topbar{height:56px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:50}
.breadcrumb{font-size:13px;color:#64748b}
.breadcrumb a{color:#4f46e5}
.content{padding:24px 28px 48px;display:flex;justify-content:center}
.preview-card{background:#fff;border-radius:12px;border:1px solid #e2e8f0;padding:32px;max-width:600px;width:100%;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.preview-card .pc-header{text-align:center;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid #e2e8f0}
.preview-card .pc-title{font-size:18px;font-weight:700;color:#4f46e5}
.preview-card .pc-sub{font-size:13px;color:#64748b;margin-top:4px}
.preview-card .pc-venue{font-size:12.5px;color:#94a3b8;margin-top:2px}
.pf-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pf-grid .full{grid-column:1/-1}
.pf-field{display:flex;flex-direction:column;gap:4px}
.pf-field label{font-size:13px;font-weight:500;color:#0f172a}
.pf-field label .req{color:#dc2626;margin-left:2px}
.pf-field input,.pf-field textarea{padding:9px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:13.5px;background:#fff;font-family:inherit;color:#0f172a}
.pf-field input:focus,.pf-field textarea:focus{outline:none;border-color:#4f46e5;box-shadow:0 0 0 3px #eef2ff}
.pf-field textarea{min-height:70px;resize:vertical}
.pf-field .pf-hint{font-size:11.5px;color:#4f46e5}
.preview-footer{margin-top:24px;padding-top:16px;border-top:1px solid #e2e8f0;display:flex;justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 32px;border-radius:8px;font-size:14px;font-weight:500;border:1px solid transparent;cursor:pointer;font-family:inherit}
.btn-primary{background:#4f46e5;color:#fff}
.btn-secondary{background:#fff;color:#0f172a;border-color:#e2e8f0}
.preview-badge{display:inline-block;padding:4px 12px;border-radius:6px;font-size:12px;font-weight:500;background:#fffbeb;color:#d97706;margin-bottom:16px}
.topbar-btns{display:flex;gap:8px}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-brand"><div class="logo">学</div>智慧学工</div>
  <nav class="sidebar-nav">
    <a class="nav-item" href="01-dashboard.html"><span class="nav-icon">📊</span>数据概览</a>
    <a class="nav-item" href="02-venue-list.html"><span class="nav-icon">📍</span>场地管理</a>
    <a class="nav-item active" href="17-form-template-list.html"><span class="nav-icon">📋</span>表单模板</a>
    <a class="nav-item" href="20-booking-list.html"><span class="nav-icon">📅</span>预约记录</a>
  </nav>
  <div class="sidebar-footer"><a href="../index.html">← 返回首页</a></div>
</aside>

<div class="main">
  <header class="topbar">
    <div class="breadcrumb"><a href="17-form-template-list.html">表单模板</a> &gt; 预览 · standard</div>
    <div class="topbar-btns">
      <a class="btn btn-secondary" href="18-form-template-edit.html">编辑模板</a>
      <a class="btn btn-secondary" href="17-form-template-list.html">返回列表</a>
    </div>
  </header>
  <div class="content">

    <div class="preview-card">
      <div style="text-align:center"><span class="preview-badge">预览模式 · 用户端视角</span></div>
      <div class="pc-header">
        <div class="pc-title">预约申请</div>
        <div class="pc-sub">模板：standard（标准会议室）</div>
        <div class="pc-venue">适用场地：206会议室、238云麓阁报告厅</div>
      </div>

      <div class="pf-grid">
        <div class="pf-field">
          <label>活动名称<span class="req">*</span></label>
          <input type="text" value="2026年春季学工例会">
        </div>
        <div class="pf-field">
          <label>参与人数<span class="req">*</span></label>
          <input type="number" value="30">
          <span class="pf-hint">不超过场地容纳人数</span>
        </div>
        <div class="pf-field">
          <label>承办单位<span class="req">*</span></label>
          <input type="text" value="学生工作部综合办">
        </div>
        <div class="pf-field">
          <label>活动负责老师</label>
          <input type="text" value="王老师">
        </div>
        <div class="pf-field">
          <label>负责老师联系方式</label>
          <input type="tel" value="138****5678">
        </div>
        <div class="pf-field">
          <label>活动学生负责人<span class="req">*</span></label>
          <input type="text" value="张三">
        </div>
        <div class="pf-field">
          <label>学生负责人联系方式<span class="req">*</span></label>
          <input type="tel" value="159****1234">
        </div>
        <div class="pf-field full">
          <label>其他需求（设备/数量）</label>
          <textarea>投屏器×1、笔记本电脑×1、茶水30杯</textarea>
        </div>
      </div>

      <div class="preview-footer">
        <span class="btn btn-primary">提交预约</span>
      </div>
    </div>

  </div>
</div>

</body>
</html>
