<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>新增表单模板 - 场地预约后台</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f8fafc;color:#0f172a;display:flex;min-height:100vh}
a{text-decoration:none;color:inherit}
.sidebar{width:220px;background:#fff;border-right:1px solid #e2e8f0;position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column}
.sidebar-brand{height:56px;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid #e2e8f0;font-weight:600;font-size:15px}
.sidebar-brand .logo{width:28px;height:28px;border-radius:7px;background:#4f46e5;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.sidebar-nav{flex:1;padding:12px 8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:6px;font-size:13.5px;color:#64748b;margin-bottom:2px}
.nav-item:hover{background:#f1f5f9;color:#0f172a}
.nav-item.active{background:#eef2ff;color:#4f46e5;font-weight:500}
.nav-icon{width:20px;text-align:center;font-size:15px}
.sidebar-footer{padding:12px 20px;border-top:1px solid #e2e8f0}
.sidebar-footer a{color:#64748b;font-size:12px}
.main{margin-left:220px;flex:1}
.topbar{height:56px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:50}
.breadcrumb{font-size:13px;color:#64748b}
.breadcrumb a{color:#4f46e5}
.content{padding:24px 28px 48px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:1100px}
.section{background:#fff;border-radius:10px;border:1px solid #e2e8f0;padding:20px;margin-bottom:20px}
.section h3{font-size:15px;font-weight:600;margin-bottom:4px}
.section .desc{font-size:12.5px;color:#64748b;margin-bottom:14px}
.form-group{margin-bottom:16px}
.form-label{font-size:12.5px;color:#64748b;margin-bottom:4px;display:flex;align-items:center;gap:4px}
.form-label .req{color:#ef4444;font-size:14px}
.form-input{width:100%;padding:8px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:13.5px;font-family:inherit}
.form-input:focus{outline:none;border-color:#4f46e5;box-shadow:0 0 0 3px #eef2ff}
textarea.form-input{height:60px;resize:vertical}
.form-hint{font-size:11px;color:#94a3b8;margin-top:3px}
.field-list{border:1px solid #e2e8f0;border-radius:8px;overflow:hidden}
.field-row{display:grid;grid-template-columns:28px 1fr 70px 50px 100px;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid #f1f5f9;font-size:12.5px}
.field-row:last-child{border-bottom:none}
.field-row.header{background:#f8fafc;font-weight:500;color:#64748b;font-size:11.5px}
.drag{color:#cbd5e1;cursor:grab;text-align:center}
.fname{font-weight:500}
.type-badge{display:inline-block;padding:1px 5px;border-radius:4px;font-size:10.5px;background:#f1f5f9;color:#64748b}
.req-dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.req-dot.yes{background:#059669}
.req-dot.no{background:#e2e8f0}
.field-actions{display:flex;gap:8px}
.action-link{font-size:11.5px;cursor:pointer}
.action-link.edit{color:#4f46e5}
.action-link.del{color:#dc2626}
.add-field-btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;border:1px dashed #cbd5e1;border-radius:8px;color:#64748b;font-size:12.5px;cursor:pointer;margin-top:10px}
.add-field-btn:hover{border-color:#4f46e5;color:#4f46e5}
.preview-form{background:#f8fafc;border-radius:8px;padding:16px}
.preview-form .pf-title{font-size:14px;font-weight:600;margin-bottom:14px;color:#4f46e5}
.pf-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pf-grid .full{grid-column:1/-1}
.pf-field{display:flex;flex-direction:column;gap:3px}
.pf-field label{font-size:11.5px;font-weight:500;color:#64748b}
.pf-field label .req{color:#dc2626}
.pf-field input,.pf-field textarea{padding:7px 10px;border:1px solid #e2e8f0;border-radius:6px;font-size:12.5px;background:#fff;font-family:inherit;color:#94a3b8}
.pf-field textarea{min-height:50px;resize:vertical}
.empty-hint{text-align:center;padding:24px;color:#94a3b8;font-size:13px}
.btn-row{display:flex;gap:10px;margin-top:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 18px;border-radius:8px;font-size:13.5px;font-weight:500;border:1px solid transparent;cursor:pointer;font-family:inherit}
.btn-secondary{background:#fff;color:#0f172a;border-color:#e2e8f0}
.btn-primary{background:#4f46e5;color:#fff}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-brand"><div class="logo">学</div>智慧学工</div>
  <nav class="sidebar-nav">
    <a class="nav-item" href="01-dashboard.html"><span class="nav-icon">📊</span>数据概览</a>
    <a class="nav-item" href="02-venue-list.html"><span class="nav-icon">📍</span>场地管理</a>
    <a class="nav-item active" href="17-form-template-list.html"><span class="nav-icon">📋</span>表单模板</a>
    <a class="nav-item" href="20-booking-list.html"><span class="nav-icon">📅</span>预约记录</a>
  </nav>
  <div class="sidebar-footer"><a href="../index.html">← 返回首页</a></div>
</aside>

<div class="main">
  <header class="topbar">
    <div class="breadcrumb"><a href="17-form-template-list.html">表单模板</a> &gt; 新增模板</div>
    <a class="btn btn-secondary" href="17-form-template-list.html">返回列表</a>
  </header>
  <div class="content">

    <div class="section" style="max-width:1100px">
      <h3>模板基本信息</h3>
      <div class="desc">填写新模板的标识和名称，标识创建后不可修改</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
        <div class="form-group">
          <div class="form-label"><span class="req">*</span> 模板标识</div>
          <input class="form-input" type="text" placeholder="英文标识，如 custom01" value="custom01">
          <div class="form-hint">仅支持英文、数字和下划线，创建后不可更改</div>
        </div>
        <div class="form-group">
          <div class="form-label"><span class="req">*</span> 模板名称</div>
          <input class="form-input" type="text" placeholder="中文名称，如 自定义表单" value="自定义表单">
        </div>
      </div>
      <div class="form-group" style="max-width:calc(50% - 8px)">
        <div class="form-label">模板说明</div>
        <textarea class="form-input" placeholder="可选，描述该模板的适用场景…">适用于需要自定义字段的特殊场地预约场景</textarea>
      </div>
    </div>

    <div class="two-col">
      <div>
        <div class="section">
          <h3>字段配置</h3>
          <div class="desc">拖拽可调整字段顺序，点击编辑可修改字段属性</div>
          <div class="field-list">
            <div class="field-row header"><span></span><span>字段名称</span><span>类型</span><span>必填</span><span>操作</span></div>
            <div class="field-row"><span class="drag">⠿</span><span class="fname">活动名称</span><span><span class="type-badge">文本</span></span><span><span class="req-dot yes"></span></span><span class="field-actions"><a class="action-link edit">编辑</a><a class="action-link del">删除</a></span></div>
            <div class="field-row"><span class="drag">⠿</span><span class="fname">联系人</span><span><span class="type-badge">文本</span></span><span><span class="req-dot yes"></span></span><span class="field-actions"><a class="action-link edit">编辑</a><a class="action-link del">删除</a></span></div>
            <div class="field-row"><span class="drag">⠿</span><span class="fname">联系电话</span><span><span class="type-badge">电话</span></span><span><span class="req-dot yes"></span></span><span class="field-actions"><a class="action-link edit">编辑</a><a class="action-link del">删除</a></span></div>
          </div>
          <a class="add-field-btn" href="24-form-template-add-field.html">＋ 添加字段</a>
        </div>
      </div>

      <div>
        <div class="section">
          <h3>实时预览</h3>
          <div class="desc">预览用户端填写表单的效果</div>
          <div class="preview-form">
            <div class="pf-title">预约申请表 · custom01</div>
            <div class="pf-grid">
              <div class="pf-field full">
                <label>活动名称<span class="req">*</span></label>
                <input type="text" placeholder="请输入活动名称">
              </div>
              <div class="pf-field">
                <label>联系人<span class="req">*</span></label>
                <input type="text" placeholder="请输入联系人姓名">
              </div>
              <div class="pf-field">
                <label>联系电话<span class="req">*</span></label>
                <input type="tel" placeholder="请输入电话号码">
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="btn-row">
      <a class="btn btn-secondary" href="17-form-template-list.html">取消</a>
      <a class="btn btn-primary" href="17-form-template-list.html">保存模板</a>
    </div>

  </div>
</div>

<script src="field-sort.js"></script>
</body>
</html>
