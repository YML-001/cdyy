      <div class="m-field">
        <label>字段类型 <span style="color:#dc2626">*</span></label>
        <div class="type-options">
          <a class="type-opt" href="42-addfield-text.html"><span class="t-icon">📝</span>文本</a>
          <a class="type-opt" href="43-addfield-number.html"><span class="t-icon">🔢</span>数字</a>
          <a class="type-opt" href="44-addfield-phone.html"><span class="t-icon">📱</span>电话</a>

          <a class="type-opt" href="45-addfield-date.html"><span class="t-icon">📅</span>日期</a>

          <div class="type-opt selected"><span class="t-icon">☑️</span>多选</div>
          <a class="type-opt" href="48-addfield-file.html"><span class="t-icon">📎</span>文件</a>
          <a class="type-opt" href="56-addfield-equipment.html"><span class="t-icon">🔧</span>设备选择</a>
        </div>

          <div class="type-config-title">多选选项配置 <span class="tc-badge">CHECKBOX</span></div>
          <div class="opt-list">
            <div class="opt-item"><input type="text" value="投影仪"><span class="opt-del">✕</span></div>
            <div class="opt-item"><input type="text" value="麦克风"><span class="opt-del">✕</span></div>
            <div class="opt-item"><input type="text" value="白板"><span class="opt-del">✕</span></div>
            <div class="opt-item"><input type="text" value="音响"><span class="opt-del">✕</span></div>
            <div class="opt-item"><input type="text" value="翻页笔"><span class="opt-del">✕</span></div>
            <div class="opt-item"><input type="text" value="桌椅重新摆放"><span class="opt-del">✕</span></div>
          </div>
