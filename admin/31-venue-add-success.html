<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>新增场地成功 - 场地预约后台</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f8fafc;color:#0f172a;display:flex;min-height:100vh}
a{text-decoration:none;color:inherit}
.sidebar{width:220px;background:#fff;border-right:1px solid #e2e8f0;position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column}
.sidebar-brand{height:56px;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid #e2e8f0;font-weight:600;font-size:15px}
.sidebar-brand .logo{width:28px;height:28px;border-radius:7px;background:#4f46e5;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.sidebar-nav{flex:1;padding:12px 8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:6px;font-size:13.5px;color:#64748b;margin-bottom:2px}
.nav-item:hover{background:#f1f5f9;color:#0f172a}
.nav-item.active{background:#eef2ff;color:#4f46e5;font-weight:500}
.nav-icon{width:20px;text-align:center;font-size:15px}
.sidebar-footer{padding:12px 20px;border-top:1px solid #e2e8f0}
.sidebar-footer a{color:#64748b;font-size:12px}
.main{margin-left:220px;flex:1}
.topbar{height:56px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:50}
.breadcrumb{font-size:13px;color:#64748b}
.breadcrumb a{color:#4f46e5}
.content{padding:24px 28px 48px;max-width:800px}
.success-card{background:#fff;border-radius:14px;border:1px solid #e2e8f0;padding:48px;text-align:center;margin-bottom:32px}
.success-icon{width:72px;height:72px;border-radius:50%;background:#ecfdf5;display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 20px}
.success-title{font-size:20px;font-weight:600;color:#059669;margin-bottom:8px}
.success-desc{font-size:14px;color:#64748b;margin-bottom:32px}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;text-align:left;max-width:480px;margin:0 auto;border:1px solid #e2e8f0;border-radius:10px;overflow:hidden}
.summary-cell{padding:12px 16px;font-size:13px;border-bottom:1px solid #f1f5f9}
.summary-cell.label{background:#f8fafc;color:#64748b;font-weight:500;border-right:1px solid #f1f5f9}
.summary-cell.value{font-weight:500;color:#0f172a}
.btn-group{display:flex;gap:12px;justify-content:center;margin-top:32px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 24px;border-radius:8px;font-size:14px;font-weight:500;border:1px solid transparent;cursor:pointer;font-family:inherit}
.btn-primary{background:#4f46e5;color:#fff}
.btn-secondary{background:#fff;color:#0f172a;border-color:#e2e8f0}
.btn-success{background:#059669;color:#fff}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-brand"><div class="logo">学</div>智慧学工</div>
  <nav class="sidebar-nav">
    <a class="nav-item" href="01-dashboard.html"><span class="nav-icon">📊</span>数据概览</a>
    <a class="nav-item active" href="02-venue-list.html"><span class="nav-icon">📍</span>场地管理</a>
    <a class="nav-item" href="17-form-template-list.html"><span class="nav-icon">📋</span>表单模板</a>
    <a class="nav-item" href="20-booking-list.html"><span class="nav-icon">📅</span>预约记录</a>
  </nav>
  <div class="sidebar-footer"><a href="../index.html">← 返回首页</a></div>
</aside>

<div class="main">
  <header class="topbar">
    <div class="breadcrumb"><a href="02-venue-list.html">场地管理</a> &gt; 新增场地</div>
  </header>
  <div class="content">

    <div class="success-card">
      <div class="success-icon">✓</div>
      <div class="success-title">场地创建成功</div>
      <div class="success-desc">新场地已创建完成，可立即在前台使用或前往管理列表查看</div>

      <div class="summary-grid">
        <div class="summary-cell label">场地名称</div>
        <div class="summary-cell value">（新建场地）</div>
        <div class="summary-cell label">所属科室</div>
        <div class="summary-cell value">（已选择科室）</div>
        <div class="summary-cell label">场地负责人</div>
        <div class="summary-cell value">（默认为创建人）</div>
        <div class="summary-cell label">场地类型</div>
        <div class="summary-cell value">系统内预约</div>
        <div class="summary-cell label">时段策略</div>
        <div class="summary-cell value">整点制（1小时）</div>
        <div class="summary-cell label">表单模板</div>
        <div class="summary-cell value">standard（8个字段）</div>
        <div class="summary-cell label">审批对象</div>
        <div class="summary-cell value">（已选择人员或角色）</div>
        <div class="summary-cell label">审批流程</div>
        <div class="summary-cell value">管理员审批</div>
        <div class="summary-cell label">发起权限</div>
        <div class="summary-cell value">全体在校生、学校教师</div>
        <div class="summary-cell label">当前状态</div>
        <div class="summary-cell value" style="color:#059669;font-weight:600">正常使用</div>
      </div>
    </div>

    <div class="btn-group">
      <a class="btn btn-secondary" href="02-venue-list.html">返回场地列表</a>
      <a class="btn btn-primary" href="04-venue-detail.html">查看场地详情</a>
      <a class="btn btn-success" href="05-venue-add-basic.html">继续新增场地</a>
    </div>

  </div>
</div>

<script>
(function(){
  if(new URLSearchParams(location.search).get('type')!=='tuanwei'){return;}
  var V={'所属科室':'校团委','场地类型':'校团委活动场地','时段策略':'半天制（上午/下午/晚上）','表单模板':'校园文化活动场地申请表（11个字段）',
    '审批对象':'表单字段 / 上级指定 / 角色','审批人管理权限':'场地主管自动获得','审批流程':'负责老师 → 二级单位 → 保卫部（≥500人）→ 场地主管 → 值班知会'};
  Array.prototype.forEach.call(document.querySelectorAll('.summary-cell.label'),function(l){
    var v=V[l.textContent.trim()];if(!v){return;}
    var t=l.nextElementSibling;if(t){t.textContent=v;}
  });
})();
</script>
<script src="tuanwei-flow.js"></script>

</html>
