*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f8fafc;color:#0f172a;display:flex;min-height:100vh}
a{text-decoration:none;color:inherit}
.sidebar{width:220px;background:#fff;border-right:1px solid #e2e8f0;position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column}
.sidebar-brand{height:56px;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid #e2e8f0;font-weight:600;font-size:15px}
.sidebar-brand .logo{width:28px;height:28px;border-radius:7px;background:#4f46e5;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.sidebar-nav{flex:1;padding:12px 8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:6px;font-size:13.5px;color:#64748b;margin-bottom:2px}
.nav-item:hover{background:#f1f5f9;color:#0f172a}
.nav-item.active{background:#eef2ff;color:#4f46e5;font-weight:500}
.nav-icon{width:20px;text-align:center;font-size:15px}
.sidebar-footer{padding:12px 20px;border-top:1px solid #e2e8f0}
.sidebar-footer a{color:#64748b;font-size:12px}
.main{margin-left:220px;flex:1}
.topbar{height:56px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:50}
.breadcrumb{font-size:13px;color:#64748b}
.breadcrumb a{color:#4f46e5}
.content{padding:24px 28px 48px;max-width:1000px}
.tabs{display:flex;gap:0;border-bottom:2px solid #e2e8f0;margin-bottom:24px}
.tab{padding:10px 20px;font-size:13.5px;color:#64748b;border-bottom:2px solid transparent;margin-bottom:-2px;font-weight:500}
.tab.active{color:#4f46e5;border-bottom-color:#4f46e5}
.tab.done{color:#059669}
.tab.disabled{color:#cbd5e1;pointer-events:none}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:14px;width:520px;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid #e2e8f0}
.modal-header h3{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
.modal-close{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#94a3b8;cursor:pointer}
.modal-close:hover{background:#f1f5f9;color:#0f172a}
.modal-body{padding:20px 24px}
.m-field{margin-bottom:16px}
.m-field label{display:block;font-size:12.5px;font-weight:500;margin-bottom:6px;color:#0f172a}
.m-field input,.m-field select{width:100%;padding:8px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:13.5px;font-family:inherit;color:#0f172a;background:#fff}
.m-field .m-hint{font-size:11px;color:#94a3b8;margin-top:4px}
.condition-row{display:flex;gap:8px;align-items:center}
.condition-row select,.condition-row input{flex:1;padding:8px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:13.5px;font-family:inherit}
.preview-box{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:14px;margin-top:8px}
.preview-box .preview-label{font-size:11px;color:#92400e;font-weight:500;margin-bottom:8px}
.flow-visual{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flow-node{padding:6px 12px;border-radius:6px;background:#eef2ff;color:#4f46e5;font-size:12px;font-weight:500}
.flow-node.start{background:#ecfdf5;color:#059669}
.flow-node.end{background:#ecfdf5;color:#059669}
.flow-node.cond{padding:6px 12px;border:2px dashed #f59e0b;border-radius:6px;background:#fffbeb;color:#92400e;font-weight:500}
.flow-arrow{color:#94a3b8;font-size:14px}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid #e2e8f0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 18px;border-radius:8px;font-size:13.5px;font-weight:500;border:1px solid transparent;cursor:pointer;font-family:inherit}
.btn-primary{background:#4f46e5;color:#fff}
.btn-secondary{background:#fff;color:#0f172a;border-color:#e2e8f0}
</style>

</aside>

<div class="main">
  <header class="topbar">
    <div class="breadcrumb"><a href="02-venue-list.html">场地管理</a> &gt; 新增场地</div>
    <a class="btn btn-secondary" href="02-venue-list.html">取消</a>
  </header>

    <div class="tabs">
      <a class="tab done" href="05-venue-add-basic.html">✓ 基础信息</a>

<div class="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h3>添加条件审批节点</h3>
      <a class="modal-close" href="08-venue-add-approval.html">✕</a>
    </div>
    <div class="modal-body">
      <div class="m-field">
        <label>触发字段 <span style="color:#dc2626">*</span></label>
        <select>
          <option value="">请选择表单字段</option>
          <option>活动名称</option>
          <option>活动性质</option>
          <option selected>预估人数</option>
          <option>主办单位</option>
          <option>承办单位</option>
          <option>校外参加人员</option>
        </select>
        <div class="m-hint">选择哪个表单字段的值作为触发条件</div>
      </div>
      <div class="m-field">
        <label>触发条件 <span style="color:#dc2626">*</span></label>
        <div class="condition-row">
          <select style="flex:0 0 120px">
            <option selected>>=（大于等于）</option>
            <option><=（小于等于）</option>
            <option>=（等于）</option>
            <option>包含</option>
            <option>不等于</option>
          </select>
          <input type="text" value="500" placeholder="阈值">
        </div>
        <div class="m-hint">当字段值满足该条件时触发额外审批</div>
      </div>
      <div class="m-field">
        <label>增加审批人 <span style="color:#dc2626">*</span></label>
        <select>
          <option value="">请选择审批人</option>
          <option selected>校保卫处</option>
          <option>孙瀚（综合办）</option>
          <option>李明（民族办）</option>
          <option>张华（思政办）</option>
          <option>王芳（就业指导中心）</option>
          <option>赵丽（心理中心）</option>
          <option>陈伟（学生事务办）</option>
          <option>刘洋（武装部）</option>
          <option>部门领导</option>
        </select>
      </div>
      <div class="m-field">
        <label>插入位置 <span style="color:#dc2626">*</span></label>
        <select>
          <option>第一步审批后</option>
          <option selected>管理员审批后</option>
          <option>最后一步前</option>
        </select>
        <div class="m-hint">条件满足时，该审批人将插入到指定位置</div>
      </div>

      <div class="preview-box">
        <div class="preview-label">条件流程预览</div>
        <div class="flow-visual">
          <div class="flow-node start">申请人</div>
          <span class="flow-arrow">→</span>
          <div class="flow-node">管理员</div>
          <span class="flow-arrow">→</span>
          <div class="flow-node cond">校保卫处<br><span style="font-size:9px;font-weight:400">人数>=500</span></div>
          <span class="flow-arrow">→</span>
          <div class="flow-node end">完成</div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <a class="btn btn-secondary" href="08-venue-add-approval.html">取消</a>
      <a class="btn btn-primary" href="08-venue-add-approval.html">确认添加</a>
    </div>
  </div>
</div>

</body>
