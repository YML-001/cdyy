<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>新增场地 - 权限配置 - 场地预约后台</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f8fafc;color:#0f172a;display:flex;min-height:100vh}
a{text-decoration:none;color:inherit}
.sidebar{width:220px;background:#fff;border-right:1px solid #e2e8f0;position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column}
.sidebar-brand{height:56px;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid #e2e8f0;font-weight:600;font-size:15px}
.sidebar-brand .logo{width:28px;height:28px;border-radius:7px;background:#4f46e5;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.sidebar-nav{flex:1;padding:12px 8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:6px;font-size:13.5px;color:#64748b;margin-bottom:2px}
.nav-item:hover{background:#f1f5f9;color:#0f172a}
.nav-item.active{background:#eef2ff;color:#4f46e5;font-weight:500}
.nav-icon{width:20px;text-align:center;font-size:15px}
.sidebar-footer{padding:12px 20px;border-top:1px solid #e2e8f0}
.sidebar-footer a{color:#64748b;font-size:12px}
.main{margin-left:220px;flex:1}
.topbar{height:56px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:50}
.breadcrumb{font-size:13px;color:#64748b}
.breadcrumb a{color:#4f46e5}
.content{padding:24px 28px 48px;max-width:900px}
.tabs{display:flex;gap:0;border-bottom:2px solid #e2e8f0;margin-bottom:24px}
.tab{padding:10px 20px;font-size:13.5px;color:#64748b;border-bottom:2px solid transparent;margin-bottom:-2px;font-weight:500}
.tab.active{color:#4f46e5;border-bottom-color:#4f46e5}
.tab.done{color:#059669}
.section{background:#fff;border-radius:10px;border:1px solid #e2e8f0;padding:24px;margin-bottom:20px}
.section h3{font-size:15px;font-weight:600;margin-bottom:6px}
.section .desc{font-size:12.5px;color:#64748b;margin-bottom:16px}
.check-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.check-item{display:flex;align-items:center;gap:8px;padding:10px 14px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;cursor:pointer}
.check-item:hover{border-color:#c7d2fe}
.check-item.checked{background:#eef2ff;border-color:#4f46e5;color:#4f46e5}
.check-item input{width:16px;height:16px;accent-color:#4f46e5}
.field{display:flex;flex-direction:column;gap:4px;margin-top:16px}
.field label{font-size:12.5px;font-weight:500}
.field input{width:100%;padding:8px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:13.5px;font-family:inherit;color:#0f172a;background:#fff;max-width:500px}
.field .hint{font-size:11.5px;color:#94a3b8;margin-top:2px}
.summary{background:#f0fdf4;border:1px solid #a7f3d0;border-radius:10px;padding:20px;margin-top:24px}
.summary h3{font-size:15px;font-weight:600;color:#059669;margin-bottom:12px}
.summary-item{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px solid #dcfce7}
.summary-item:last-child{border-bottom:none}
.summary-item .sl{color:#64748b}
.summary-item .sv{font-weight:500}
.btn-row{display:flex;gap:10px;margin-top:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 18px;border-radius:8px;font-size:13.5px;font-weight:500;border:1px solid transparent;cursor:pointer;font-family:inherit}
.btn-primary{background:#4f46e5;color:#fff}
.btn-primary-lg{background:#059669;color:#fff;padding:10px 28px;font-size:14px}
.btn-secondary{background:#fff;color:#0f172a;border-color:#e2e8f0}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-brand"><div class="logo">学</div>智慧学工</div>
  <nav class="sidebar-nav">
    <a class="nav-item" href="01-dashboard.html"><span class="nav-icon">📊</span>数据概览</a>
    <a class="nav-item active" href="02-venue-list.html"><span class="nav-icon">📍</span>场地管理</a>
    <a class="nav-item" href="17-form-template-list.html"><span class="nav-icon">📋</span>表单模板</a>
    <a class="nav-item" href="20-booking-list.html"><span class="nav-icon">📅</span>预约记录</a>
  </nav>
  <div class="sidebar-footer"><a href="../index.html">← 返回首页</a></div>
</aside>

<div class="main">
  <header class="topbar">
    <div class="breadcrumb"><a href="02-venue-list.html">场地管理</a> &gt; 新增场地</div>
    <a class="btn btn-secondary" href="02-venue-list.html">取消</a>
  </header>
  <div class="content">

    <div class="tabs">
      <a class="tab done" href="05-venue-add-basic.html">✓ 基础信息</a>
      <a class="tab done" href="06-venue-add-timeslot.html">✓ 时段配置</a>
      <a class="tab done" href="07-venue-add-form.html">✓ 表单模板</a>
      <a class="tab done" href="08-venue-add-approval.html">✓ 审批流程</a>
      <a class="tab active" href="09-venue-add-permission.html">权限配置</a>
    </div>

    <div class="section">
      <h3>发起预约权限</h3>
      <div class="desc">选择哪些角色可以对该场地发起预约申请，可多选。</div>

      <div class="check-grid">
        <label class="check-item checked"><input type="checkbox" checked> 全体在校生</label>
        <label class="check-item checked"><input type="checkbox" checked> 学校教师</label>
        <label class="check-item"><input type="checkbox"> 辅导员</label>
        <label class="check-item"><input type="checkbox"> 学生工作部职工</label>
        <label class="check-item"><input type="checkbox"> 校团委职工</label>
        <label class="check-item"><input type="checkbox"> 班长/副班长</label>
        <label class="check-item"><input type="checkbox"> 心理中心专兼职咨询师</label>
        <label class="check-item"><input type="checkbox"> 学院辅导员</label>
        <label class="check-item"><input type="checkbox"> 学生工作负责人</label>
      </div>

      <div class="field">
        <label>自定义权限描述</label>
        <input type="text" placeholder="如有其他角色要求，请在此描述">
        <div class="hint">当预设角色不能满足需求时，可在此补充说明</div>
      </div>
    </div>

    <div class="summary">
      <h3>配置汇总</h3>
      <div class="summary-item"><span class="sl">场地名称</span><span class="sv">（待填写）</span></div>
      <div class="summary-item"><span class="sl">所属科室</span><span class="sv">（待选择）</span></div>
      <div class="summary-item"><span class="sl">场地负责人</span><span class="sv">（默认为创建人）</span></div>
      <div class="summary-item"><span class="sl">场地类型</span><span class="sv">系统内预约</span></div>
      <div class="summary-item"><span class="sl">时段策略</span><span class="sv">整点制（1小时）</span></div>
      <div class="summary-item"><span class="sl">表单模板</span><span class="sv">standard（8个字段）</span></div>
      <div class="summary-item"><span class="sl">审批对象</span><span class="sv">（人员 / 角色）</span></div>
      <div class="summary-item"><span class="sl">审批人管理权限</span><span class="sv">已开启</span></div>
      <div class="summary-item"><span class="sl">审批流程</span><span class="sv">（待配置）</span></div>
      <div class="summary-item"><span class="sl">发起权限</span><span class="sv">全体在校生、学校教师</span></div>
    </div>

    <div class="btn-row">
      <a class="btn btn-secondary" href="08-venue-add-approval.html">← 上一步</a>
      <a class="btn btn-primary-lg" href="31-venue-add-success.html">✓ 保存并创建场地</a>
    </div>

  </div>
</div>

<script>
(function(){
  if(new URLSearchParams(location.search).get('type')!=='tuanwei'){return;}
  var V={'所属科室':'校团委','场地类型':'校团委活动场地','时段策略':'半天制（上午/下午/晚上）','表单模板':'校园文化活动场地申请表（11个字段）',
    '审批对象':'表单字段 / 上级指定 / 角色','审批人管理权限':'场地主管自动获得','审批流程':'负责老师 → 二级单位 → 保卫部（≥500人）→ 场地主管 → 值班知会'};
  Array.prototype.forEach.call(document.querySelectorAll('.summary-item .sl'),function(l){
    var v=V[l.textContent.trim()];if(!v){return;}
    var t=l.nextElementSibling;if(t){t.textContent=v;}
  });
})();
</script>
<script src="tuanwei-flow.js"></script>
</body>
</html>
