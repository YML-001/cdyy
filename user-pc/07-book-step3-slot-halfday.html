<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>选择时段 - 半天制 - 智慧学工</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f8fafc;color:#0f172a;min-height:100vh}
a{text-decoration:none;color:inherit}
.topnav{background:#fff;border-bottom:1px solid #e2e8f0;padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:50}
.topnav-brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.topnav-brand .logo{width:28px;height:28px;border-radius:7px;background:#4f46e5;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.topnav-links{display:flex;gap:4px}
.topnav-links a{padding:8px 16px;border-radius:6px;font-size:13.5px;color:#64748b;font-weight:500}
.topnav-links a.active{background:#eef2ff;color:#4f46e5}
.topnav-user{font-size:13px;color:#64748b}
.container{max-width:700px;margin:0 auto;padding:24px 32px 48px}
.page-title{font-size:20px;font-weight:700;margin-bottom:24px}
.steps{display:flex;gap:0;margin-bottom:28px}
.step{flex:1;text-align:center;padding:12px 0;position:relative;font-size:13px;color:#94a3b8}
.step .snum{width:28px;height:28px;border-radius:50%;background:#e2e8f0;color:#94a3b8;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;margin-bottom:4px}
.step.active{color:#4f46e5;font-weight:500}
.step.active .snum{background:#4f46e5;color:#fff}
.step.done{color:#059669}
.step.done .snum{background:#ecfdf5;color:#059669}
.step-line{position:absolute;top:24px;left:50%;right:-50%;height:2px;background:#e2e8f0;z-index:-1}
.step:last-child .step-line{display:none}
.section{background:#fff;border-radius:10px;border:1px solid #e2e8f0;padding:24px;margin-bottom:20px}
.section h3{font-size:15px;font-weight:600;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:16px}
.field label{font-size:12.5px;font-weight:500}
.field input{padding:9px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:13.5px;font-family:inherit;width:200px}
.slot-hint{font-size:12.5px;color:#4f46e5;margin-bottom:16px}
.halfday-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.hd-card{border:2px solid #e2e8f0;border-radius:14px;padding:24px 16px;text-align:center;cursor:pointer;background:#fff;transition:all .15s}
.hd-card:hover{border-color:#c7d2fe;background:#f8f7ff}
.hd-card.selected{border-color:#4f46e5;background:#eef2ff}
.hd-card.disabled{opacity:.4;cursor:not-allowed;background:#f8fafc}
.hd-icon{font-size:32px;margin-bottom:8px}
.hd-name{font-size:16px;font-weight:700;margin-bottom:4px}
.hd-time{font-size:13px;color:#64748b;margin-bottom:2px}
.hd-dur{font-size:12px;color:#94a3b8}
.hd-status{margin-top:10px;font-size:12px;font-weight:500;padding:3px 10px;border-radius:20px;display:inline-block}
.hd-status.avail{background:#ecfdf5;color:#059669}
.hd-status.busy{background:#fef2f2;color:#dc2626}
.hd-card.selected .hd-status{background:rgba(79,70,229,.15);color:#4f46e5}
.legend{display:flex;gap:16px;margin-top:16px;font-size:12px;color:#64748b}
.legend span{display:flex;align-items:center;gap:4px}
.legend .dot{width:12px;height:12px;border-radius:3px;border:1px solid #e2e8f0}
.legend .dot.sel{background:#4f46e5;border-color:#4f46e5}
.legend .dot.dis{background:#f1f5f9}
.btn-row{display:flex;gap:10px;justify-content:flex-end}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 22px;border-radius:8px;font-size:13.5px;font-weight:500;border:1px solid transparent;cursor:pointer;font-family:inherit}
.btn-primary{background:#4f46e5;color:#fff}
.btn-secondary{background:#fff;color:#0f172a;border-color:#e2e8f0}
</style>
</head>
<body>

<nav class="topnav">
  <div class="topnav-brand"><div class="logo">学</div>智慧学工 · 场地预约</div>
  <div class="topnav-links"><a class="active" href="01-venue-list.html">场地预约</a><a href="11-my-bookings.html">我的预约</a></div>
  <span class="topnav-user">张三 · 学生工作部</span>
</nav>

<div class="container">
  <div class="page-title">发起预约</div>
  <div class="steps">
    <div class="step done"><div class="snum">✓</div><br>选择场地<div class="step-line"></div></div>
    <div class="step done"><div class="snum">✓</div><br>填写信息<div class="step-line"></div></div>
    <div class="step active"><div class="snum">3</div><br>选择时段<div class="step-line"></div></div>
    <div class="step"><div class="snum">4</div><br>确认提交</div>
  </div>

  <div class="section">
    <h3>展览馆A厅 · 选择预约时段</h3>
    <div class="field">
      <label>预约日期</label>
      <input type="date" value="2026-04-15">
    </div>
    <div class="slot-hint">半天制 · 按上午 / 下午 / 晚间划分，每次选择一个时段。以下时段即为本场地的开放时段</div>

    <div class="halfday-grid">
      <div class="hd-card selected">
        <div class="hd-icon">🌅</div>
        <div class="hd-name">上午</div>
        <div class="hd-time">8:00 — 12:00</div>
        <div class="hd-dur">4 小时</div>
        <div class="hd-status avail">已选择</div>
      </div>
      <div class="hd-card disabled">
        <div class="hd-icon">☀️</div>
        <div class="hd-name">下午</div>
        <div class="hd-time">13:00 — 17:00</div>
        <div class="hd-dur">4 小时</div>
        <div class="hd-status busy">已占用</div>
      </div>
      <div class="hd-card">
        <div class="hd-icon">🌙</div>
        <div class="hd-name">晚间</div>
        <div class="hd-time">18:00 — 21:00</div>
        <div class="hd-dur">3 小时</div>
        <div class="hd-status avail">可预约</div>
      </div>
    </div>

    <div class="legend">
      <span><span class="dot"></span> 可选</span>
      <span><span class="dot sel"></span> 已选</span>
      <span><span class="dot dis"></span> 已占用</span>
      <span style="margin-left:auto;color:#94a3b8">每天 3 个时段</span>
    </div>
  </div>

  <div class="btn-row">
    <a class="btn btn-secondary" href="04-book-step2-form-standard.html">← 上一步</a>
    <a class="btn btn-primary" href="09-book-step4-confirm.html">下一步 →</a>
  </div>
</div>

</body>
</html>
