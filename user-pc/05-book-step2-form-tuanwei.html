<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>填写信息（团委场地）- 发起预约 - 智慧学工</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f8fafc;color:#0f172a;min-height:100vh}
a{text-decoration:none;color:inherit}
.topnav{background:#fff;border-bottom:1px solid #e2e8f0;padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:50}
.topnav-brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.topnav-brand .logo{width:28px;height:28px;border-radius:7px;background:#4f46e5;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.topnav-links{display:flex;gap:4px}
.topnav-links a{padding:8px 16px;border-radius:6px;font-size:13.5px;color:#64748b;font-weight:500}
.topnav-links a.active{background:#eef2ff;color:#4f46e5}
.topnav-user{font-size:13px;color:#64748b}
.container{max-width:700px;margin:0 auto;padding:24px 32px 48px}
.page-title{font-size:20px;font-weight:700;margin-bottom:24px}
.steps{display:flex;gap:0;margin-bottom:28px}
.step{flex:1;text-align:center;padding:12px 0;position:relative;font-size:13px;color:#94a3b8}
.step .snum{width:28px;height:28px;border-radius:50%;background:#e2e8f0;color:#94a3b8;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;margin-bottom:4px}
.step.active{color:#4f46e5;font-weight:500}
.step.active .snum{background:#4f46e5;color:#fff}
.step.done{color:#059669}
.step.done .snum{background:#ecfdf5;color:#059669}
.step-line{position:absolute;top:24px;left:50%;right:-50%;height:2px;background:#e2e8f0;z-index:-1}
.step:last-child .step-line{display:none}
.section{background:#fff;border-radius:10px;border:1px solid #e2e8f0;padding:24px;margin-bottom:20px}
.section h3{font-size:15px;font-weight:600;margin-bottom:16px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-grid .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12.5px;font-weight:500;color:#0f172a}
.field label .req{color:#dc2626;margin-left:2px}
.field input,.field select,.field textarea{width:100%;padding:8px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:13.5px;font-family:inherit;color:#0f172a;background:#fff}
.field textarea{min-height:80px;resize:vertical}
.field .hint{font-size:11.5px;color:#94a3b8;margin-top:2px}
.radio-inline{display:flex;gap:12px;flex-wrap:wrap;padding:4px 0}
.radio-inline label{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;font-weight:400;padding:6px 12px;border:1px solid #e2e8f0;border-radius:6px}
.radio-inline label:hover{border-color:#c7d2fe}
.radio-inline label.checked{border-color:#4f46e5;background:#eef2ff;color:#4f46e5}
.radio-inline input{width:16px;height:16px;accent-color:#4f46e5}
.equip-section{border:1px solid #e2e8f0;border-radius:8px;padding:14px}
.equip-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.equip-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid #e2e8f0;border-radius:6px;font-size:13px;cursor:pointer}
.equip-item:hover{border-color:#c7d2fe}
.equip-item.checked{border-color:#4f46e5;background:#eef2ff}
.equip-item input[type="checkbox"]{width:16px;height:16px;accent-color:#4f46e5;flex-shrink:0}
.equip-item .qty-input{width:60px;padding:4px 8px;border:1px solid #c7d2fe;border-radius:4px;font-size:12px;text-align:center;margin-left:auto}
.equip-hint{font-size:11px;color:#94a3b8;margin-top:8px}
.btn-row{display:flex;gap:10px;justify-content:flex-end;margin-top:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 28px;border-radius:8px;font-size:14px;font-weight:500;border:1px solid transparent;cursor:pointer;font-family:inherit}
.btn-primary{background:#4f46e5;color:#fff}
.btn-secondary{background:#fff;color:#0f172a;border-color:#e2e8f0}
</style>
</head>
<body>

<nav class="topnav">
  <div class="topnav-brand"><div class="logo">学</div>智慧学工 · 场地预约</div>
  <div class="topnav-links"><a class="active" href="01-venue-list.html">场地预约</a><a href="11-my-bookings.html">我的预约</a></div>
  <span class="topnav-user">张三 · 校团委</span>
</nav>

<div class="container">
  <div class="page-title">发起预约 — 新校区毓秀楼和声堂</div>
  <div class="steps">
    <div class="step done"><div class="snum">✓</div><br>选择场地<div class="step-line"></div></div>
    <div class="step active"><div class="snum">2</div><br>填写信息<div class="step-line"></div></div>
    <div class="step"><div class="snum">3</div><br>选择时段<div class="step-line"></div></div>
    <div class="step"><div class="snum">4</div><br>确认提交</div>
  </div>

  <div class="section">
    <h3>活动基础信息</h3>
    <div class="form-grid">
      <div class="field full">
        <label>活动名称<span class="req">*</span></label>
        <input type="text" value="2026年校园歌手大赛决赛">
      </div>
      <div class="field full">
        <label>活动性质<span class="req">*</span></label>
        <div class="radio-inline">
          <label class="checked"><input type="radio" name="nature" checked> 文艺演出或晚会</label>
          <label><input type="radio" name="nature"> 会议</label>
          <label><input type="radio" name="nature"> 交流分享会</label>
          <label><input type="radio" name="nature"> 竞赛</label>
          <label><input type="radio" name="nature"> 其他</label>
        </div>
      </div>
      <div class="field">
        <label>主办单位<span class="req">*</span></label>
        <input type="text" value="校团委">
      </div>
      <div class="field">
        <label>承办单位<span class="req">*</span></label>
        <input type="text" value="校学生会文艺部">
      </div>
      <div class="field">
        <label>预估人数<span class="req">*</span></label>
        <input type="number" value="600">
      </div>
    </div>
  </div>

  <div class="section">
    <h3>参与人员信息</h3>
    <div class="form-grid">
      <div class="field full">
        <label>校外参加人员</label>
        <textarea placeholder="如有校外人员参加请说明人员单位及人数">特邀评委：湖南卫视音乐总监李某 1人</textarea>
      </div>
      <div class="field full">
        <label>拟邀请嘉宾</label>
        <textarea placeholder="如有特邀嘉宾请注明姓名与身份">校党委副书记、各学院团委书记</textarea>
      </div>
    </div>
  </div>

  <div class="section">
    <h3>拟使用设备</h3>
    <div class="equip-section">
      <div class="equip-grid">
        <div class="equip-item checked">
          <input type="checkbox" checked> 照明灯
        </div>
        <div class="equip-item checked">
          <input type="checkbox" checked> 舞台灯
        </div>
        <div class="equip-item checked">
          <input type="checkbox" checked> 音响
        </div>
        <div class="equip-item checked">
          <input type="checkbox" checked> 话筒
          <input class="qty-input" type="number" value="4" min="1">
        </div>
        <div class="equip-item checked">
          <input type="checkbox" checked> 耳麦
          <input class="qty-input" type="number" value="2" min="1">
        </div>
        <div class="equip-item checked">
          <input type="checkbox" checked> LED屏
        </div>
        <div class="equip-item">
          <input type="checkbox"> 投影仪
        </div>
        <div class="equip-item">
          <input type="checkbox"> 钢琴
        </div>
        <div class="equip-item">
          <input type="checkbox"> 外租设备
        </div>
      </div>
      <div class="equip-hint">勾选所需设备，部分设备需填写使用数量</div>
    </div>
  </div>

  <div class="section">
    <h3>负责人信息</h3>
    <div class="form-grid">
      <div class="field">
        <label>活动负责老师<span class="req">*</span></label>
        <input type="text" value="王老师">
        <div class="hint">活动当天现场负责人</div>
      </div>
      <div class="field">
        <label>负责老师联系方式<span class="req">*</span></label>
        <input type="tel" value="138****5678">
      </div>
      <div class="field">
        <label>活动学生负责人（消防协管）<span class="req">*</span></label>
        <input type="text" value="张三">
      </div>
      <div class="field">
        <label>学生负责人联系方式<span class="req">*</span></label>
        <input type="tel" value="159****1234">
      </div>
    </div>
  </div>

  <div class="btn-row">
    <a class="btn btn-secondary" href="03-book-step1-select.html">← 上一步</a>
    <a class="btn btn-primary" href="07-book-step3-slot-hour.html">下一步：选择时段 →</a>
  </div>
</div>

</body>
</html>
