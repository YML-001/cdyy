<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>填写信息（团委场地）- 发起预约 - 智慧学工</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f8fafc;color:#0f172a;min-height:100vh}
a{text-decoration:none;color:inherit}
.topnav{background:#fff;border-bottom:1px solid #e2e8f0;padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:50}
.topnav-brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.topnav-brand .logo{width:28px;height:28px;border-radius:7px;background:#4f46e5;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.topnav-links{display:flex;gap:4px}
.topnav-links a{padding:8px 16px;border-radius:6px;font-size:13.5px;color:#64748b;font-weight:500}
.topnav-links a.active{background:#eef2ff;color:#4f46e5}
.topnav-user{font-size:13px;color:#64748b}
.container{max-width:700px;margin:0 auto;padding:24px 32px 48px}
.page-title{font-size:20px;font-weight:700;margin-bottom:24px}
.steps{display:flex;gap:0;margin-bottom:28px}
.step{flex:1;text-align:center;padding:12px 0;position:relative;font-size:13px;color:#94a3b8}
.step .snum{width:28px;height:28px;border-radius:50%;background:#e2e8f0;color:#94a3b8;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;margin-bottom:4px}
.step.active{color:#4f46e5;font-weight:500}
.step.active .snum{background:#4f46e5;color:#fff}
.step.done{color:#059669}
.step.done .snum{background:#ecfdf5;color:#059669}
.step-line{position:absolute;top:24px;left:50%;right:-50%;height:2px;background:#e2e8f0;z-index:-1}
.step:last-child .step-line{display:none}
.section{background:#fff;border-radius:10px;border:1px solid #e2e8f0;padding:24px;margin-bottom:20px}
.section h3{font-size:15px;font-weight:600;margin-bottom:16px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-grid .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12.5px;font-weight:500;color:#0f172a}
.field label .req{color:#dc2626;margin-left:2px}
.field input,.field select,.field textarea{width:100%;padding:8px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:13.5px;font-family:inherit;color:#0f172a;background:#fff}
.field textarea{min-height:80px;resize:vertical}
.field .hint{font-size:11.5px;color:#94a3b8;margin-top:2px}
.radio-inline{display:flex;gap:12px;flex-wrap:wrap;padding:4px 0}
.radio-inline label{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;font-weight:400;padding:6px 12px;border:1px solid #e2e8f0;border-radius:6px}
.radio-inline label:hover{border-color:#c7d2fe}
.radio-inline label.checked{border-color:#4f46e5;background:#eef2ff;color:#4f46e5}
.radio-inline input{width:16px;height:16px;accent-color:#4f46e5}
.equip-section{border:1px solid #e2e8f0;border-radius:8px;padding:14px}
.equip-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.equip-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid #e2e8f0;border-radius:6px;font-size:13px;cursor:pointer}
.equip-item:hover{border-color:#c7d2fe}
.equip-item.checked{border-color:#4f46e5;background:#eef2ff}
.equip-item input[type="checkbox"]{width:16px;height:16px;accent-color:#4f46e5;flex-shrink:0}
.equip-item .qty-input{width:60px;padding:4px 8px;border:1px solid #c7d2fe;border-radius:4px;font-size:12px;text-align:center;margin-left:auto}
.equip-hint{font-size:11px;color:#94a3b8;margin-top:8px}
.btn-row{display:flex;gap:10px;justify-content:flex-end;margin-top:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 28px;border-radius:8px;font-size:14px;font-weight:500;border:1px solid transparent;cursor:pointer;font-family:inherit}
.btn-primary{background:#4f46e5;color:#fff}
.btn-secondary{background:#fff;color:#0f172a;border-color:#e2e8f0}
.picker{position:relative}
.pk-input{display:flex;align-items:center;flex-wrap:wrap;gap:4px;min-height:38px;padding:4px 30px 4px 8px;border:1px solid #e2e8f0;border-radius:8px;background:#fff;cursor:text;position:relative}
.pk-input input{flex:1;min-width:120px;border:none!important;padding:4px!important;outline:none;font-size:13.5px}
.pk-icon{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;color:#94a3b8}
.pk-chips{display:contents}
.pk-chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;background:#eef2ff;color:#4338ca;font-size:12.5px}
.pk-chip small{color:#64748b;font-size:11px}
.pk-chip b{cursor:pointer;color:#94a3b8;font-weight:400}
.pk-drop{display:none;position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#fff;border:1px solid #e2e8f0;border-radius:8px;box-shadow:0 8px 24px rgba(15,23,42,.08);max-height:220px;overflow:auto;z-index:20}
.pk-drop.show{display:block}
.pk-opt{padding:8px 12px;font-size:13px;cursor:pointer}
.pk-opt:hover{background:#f8fafc}
.pk-opt small{margin-left:8px;color:#94a3b8;font-size:11.5px}
.pk-empty{padding:10px 12px;font-size:12px;color:#94a3b8}
.shot-box{display:flex;align-items:center;gap:10px}
.shot-add{padding:12px 16px;border:1px dashed #cbd5e1;border-radius:8px;font-size:13px;color:#475569;cursor:pointer;display:flex;align-items:center;gap:8px}
.shot-add span{font-size:18px;color:#4f46e5}
.shot-add:hover{border-color:#4f46e5}
.shot-img{width:120px;height:72px;border-radius:6px;background:linear-gradient(135deg,#bfdbfe,#3b82f6)}
.shot-name{font-size:12.5px;color:#64748b}
.field input.bad{border-color:#fca5a5;background:#fef2f2}
.err-box{display:none;padding:10px 14px;border-radius:8px;background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;font-size:13px}
.tpl-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;padding:10px 12px;border:1px solid #e2e8f0;border-radius:8px;background:#f8fafc}
.tpl-name{font-size:13px;font-weight:500}
.tpl-dl,.tpl-up{font-size:12.5px;padding:4px 10px;border-radius:6px;border:1px solid #c7d2fe;background:#fff;color:#4f46e5;cursor:pointer;font-family:inherit;text-decoration:none}
.tpl-up{border-color:#e2e8f0;color:#0f172a}
.tpl-done{font-size:12px;color:#059669}
</style>
</head>
<body>

<nav class="topnav">
  <div class="topnav-brand"><div class="logo">学</div>智慧学工 · 场地预约</div>
  <div class="topnav-links"><a class="active" href="01-venue-list.html">场地预约</a><a href="11-my-bookings.html">我的预约</a></div>
  <span class="topnav-user">张三 · 校团委</span>
</nav>

<div class="container">
  <div class="page-title">发起预约 — 毓秀楼和声堂</div>
  <div class="steps">
    <div class="step done"><div class="snum">✓</div><br>选择场地<div class="step-line"></div></div>
    <div class="step active"><div class="snum">2</div><br>填写信息<div class="step-line"></div></div>
    <div class="step"><div class="snum">3</div><br>选择时段<div class="step-line"></div></div>
    <div class="step"><div class="snum">4</div><br>确认提交</div>
  </div>

  <div class="section">
    <h3>活动基础信息</h3>
    <div class="form-grid">
      <div class="field full">
        <label>活动名称<span class="req">*</span></label>
        <input type="text" value="2026年校园歌手大赛决赛">
      </div>
      <div class="field full">
        <label>活动性质<span class="req">*</span></label>
        <div class="radio-inline" id="natureGroup">
          <label class="checked"><input type="radio" name="nature" value="文艺演出或晚会" checked> 文艺演出或晚会</label>
          <label><input type="radio" name="nature" value="会议"> 会议</label>
          <label><input type="radio" name="nature" value="竞赛"> 竞赛</label>
          <label><input type="radio" name="nature" value="哲学社科理论类讲座"> 哲学社科理论类讲座</label>
          <label><input type="radio" name="nature" value="其他"> 其他</label>
        </div>
      </div>
      <div class="field full" id="shotField" style="display:none">
        <label>审核通过界面截图<span class="req">*</span></label>
        <div class="shot-box">
          <div class="shot-add" id="shotAdd"><span>+</span>上传「哲学社科理论类论坛申请」审核通过界面截图</div>
        </div>
        <div class="hint">选择「哲学社科理论类讲座」时必填，支持 JPG/PNG</div>
      </div>
      <div class="field full">
        <label>是否需要外接设备<span class="req">*</span></label>
        <div class="radio-inline" id="extGroup">
          <label><input type="radio" name="ext" value="是"> 是</label>
          <label class="checked"><input type="radio" name="ext" value="否" checked> 否</label>
        </div>
      </div>
      <div class="field full" id="extFiles" style="display:none">
        <label>外接设备附件<span class="req">*</span></label>
        <div class="hint">请先下载模板，按实际情况修改后再上传，两份都要上传。</div>
        <div class="tpl-row" data-file="承诺书">
          <div class="tpl-name">附件1 租赁设备进场安全管理承诺书.docx</div>
          <a class="tpl-dl" href="../templates/附件1 租赁设备进场安全管理承诺书.docx" download>下载模板</a>
          <button type="button" class="tpl-up">上传</button>
          <span class="tpl-done"></span>
        </div>
        <div class="tpl-row" data-file="清单">
          <div class="tpl-name">附件2 租赁设备进场清单.docx</div>
          <a class="tpl-dl" href="../templates/附件2 租赁设备进场清单.docx" download>下载模板</a>
          <button type="button" class="tpl-up">上传</button>
          <span class="tpl-done"></span>
        </div>
      </div>
      <div class="field">
        <label>主办单位<span class="req">*</span></label>
        <div class="picker" data-picker="dept" data-init="党委学生工作部（学生工作处）"></div>
      </div>
      <div class="field">
        <label>承办单位<span class="req">*</span></label>
        <div class="picker" data-picker="dept" data-init="校学生会"></div>
      </div>
      <div class="field">
        <label>预估人数<span class="req">*</span></label>
        <input type="number" id="headcount" value="600">
        <div class="hint" id="capHint">本场地容纳人数 512 人</div>
      </div>
      <div class="field full">
        <label>拟邀请嘉宾</label>
        <textarea placeholder="如有特邀嘉宾请注明姓名与身份">校党委副书记、各学院团委书记</textarea>
      </div>
    </div>
  </div>

  <div class="section">
    <h3>负责人信息</h3>
    <div class="form-grid">
      <div class="field">
        <label>活动负责老师<span class="req">*</span></label>
        <div class="picker" data-picker="user" data-phone="teacherPhone" placeholder="点击搜索用户"></div>
        <div class="hint">活动当天现场负责人；同时为审批第一步的审批人</div>
      </div>
      <div class="field">
        <label>负责老师联系电话<span class="req">*</span></label>
        <input type="tel" id="teacherPhone" placeholder="请输入活动负责老师联系电话">
      </div>
      <div class="field">
        <label>联络人<span class="req">*</span></label>
        <div class="picker" data-picker="user" data-phone="contactPhone" data-init-user="张三"></div>
      </div>
      <div class="field">
        <label>联络人联系电话<span class="req">*</span></label>
        <input type="tel" id="contactPhone" value="159****1234">
      </div>
      <div class="field full">
        <label>备注信息</label>
        <textarea placeholder="请输入备注信息"></textarea>
      </div>
    </div>
  </div>

  <div class="err-box" id="errBox"></div>

  <div class="btn-row">
    <a class="btn btn-secondary" href="03-book-step1-select.html">← 上一步</a>
    <a class="btn btn-primary" id="nextBtn" href="07-book-step3-slot-halfday.html">下一步：选择时段 →</a>
  </div>
</div>

<script>
(function(){
  var CAP=512;
  var DEPTS=['党委学生工作部（学生工作处）','校团委','党委宣传部','保卫部','校学生会','校研究生会','文学院','计算机学院','商学院','法学院','马克思主义学院','机电工程学院'];
  var USERS=[['王老师','T20080112','校团委','138****5678'],['王强','T20050021','校团委','137****0021'],['陈建国','T20010007','学生工作部','139****0007'],['刘晓梅','T20090033','学生工作部','135****0033'],['张三','S20230101','计算机学院','159****1234'],['李思远','S20230211','文学院','139****1234']];

  // 单选样式
  Array.prototype.forEach.call(document.querySelectorAll('.radio-inline'),function(g){
    g.addEventListener('change',function(){
      Array.prototype.forEach.call(g.querySelectorAll('label'),function(l){l.classList.toggle('checked',l.querySelector('input').checked);});
      syncShot();syncExt();
    });
  });
  function nature(){return document.querySelector('input[name="nature"]:checked').value;}
  function syncShot(){document.getElementById('shotField').style.display=nature()==='哲学社科理论类讲座'?'':'none';}
  function extYes(){var el=document.querySelector('input[name="ext"]:checked');return el&&el.value==='是';}
  function syncExt(){document.getElementById('extFiles').style.display=extYes()?'':'none';}
  var extDone={};
  Array.prototype.forEach.call(document.querySelectorAll('.tpl-up'),function(btn){
    btn.addEventListener('click',function(){
      var row=btn.closest('.tpl-row');
      extDone[row.dataset.file]=true;
      row.querySelector('.tpl-done').textContent='已上传：附件'+row.dataset.file+'（已填写）.docx';
      btn.textContent='重新上传';
    });
  });
  var shotDone=false;
  document.getElementById('shotAdd').addEventListener('click',function(){
    shotDone=true;this.outerHTML='<div class="shot-img"></div><span class="shot-name">审核通过截图.png</span>';
  });

  // 部门选择 / 人员搜索
  Array.prototype.forEach.call(document.querySelectorAll('.picker'),function(box){
    var isUser=box.dataset.picker==='user',values=[];
    box.innerHTML='<div class="pk-input"><span class="pk-chips"></span><input type="text" placeholder="'+(isUser?'点击搜索用户（姓名/工号）':'搜索并选择部门，可多选')+'"><span class="pk-icon">'+(isUser?'🔍':'▾')+'</span></div><div class="pk-drop"></div>';
    var input=box.querySelector('input'),drop=box.querySelector('.pk-drop'),chips=box.querySelector('.pk-chips');
    function render(){
      chips.innerHTML=values.map(function(v,i){return '<span class="pk-chip">'+(isUser?v[0]+' <small>'+v[2]+'</small>':v)+'<b data-i="'+i+'">×</b></span>';}).join('');
      Array.prototype.forEach.call(chips.querySelectorAll('b'),function(b){b.onclick=function(e){e.stopPropagation();values.splice(+b.dataset.i,1);render();};});
      input.style.display=isUser&&values.length?'none':'';
    }
    function list(){
      var q=input.value.trim();
      var src=isUser?USERS.filter(function(u){return !q||u[0].indexOf(q)>-1||u[1].indexOf(q)>-1;}):DEPTS.filter(function(d){return (!q||d.indexOf(q)>-1)&&values.indexOf(d)<0;});
      drop.innerHTML=src.length?src.map(function(x,i){return '<div class="pk-opt" data-i="'+i+'">'+(isUser?x[0]+'<small>'+x[1]+' · '+x[2]+'</small>':x)+'</div>';}).join(''):'<div class="pk-empty">无匹配结果</div>';
      Array.prototype.forEach.call(drop.querySelectorAll('.pk-opt'),function(o){
        o.onmousedown=function(e){
          e.preventDefault();var x=src[+o.dataset.i];
          if(isUser){values=[x];var ph=document.getElementById(box.dataset.phone);if(ph){ph.value=x[3];}drop.classList.remove('show');}
          else{values.push(x);}
          input.value='';render();if(!isUser){list();}
        };
      });
      drop.classList.add('show');
    }
    input.addEventListener('focus',list);input.addEventListener('input',list);
    input.addEventListener('blur',function(){drop.classList.remove('show');});
    box.querySelector('.pk-input').addEventListener('click',function(){if(input.style.display==='none'){values=[];render();}input.focus();});
    if(box.dataset.init){values=[box.dataset.init];}
    if(box.dataset.initUser){values=USERS.filter(function(u){return u[0]===box.dataset.initUser;});}
    box._values=function(){return values;};
    render();
  });

  // 预估人数校验
  var hc=document.getElementById('headcount'),capHint=document.getElementById('capHint');
  function checkCap(){
    var over=+hc.value>CAP;
    hc.classList.toggle('bad',over);
    capHint.textContent=over?'超过场地容纳人数（'+CAP+'人），请调整预估人数或更换场地':'本场地容纳人数 '+CAP+' 人'+(+hc.value>=500?'；预估人数 ≥500 人将增加保卫部审批':'');
    capHint.style.color=over?'#dc2626':'';
    return !over;
  }
  hc.addEventListener('input',checkCap);checkCap();

  document.getElementById('nextBtn').addEventListener('click',function(e){
    var errs=[];
    if(!checkCap()){errs.push('预估人数超过场地容纳人数（'+CAP+'人）');}
    if(nature()==='哲学社科理论类讲座'&&!shotDone){errs.push('请上传审核通过界面截图');}
    if(extYes()&&(!extDone['承诺书']||!extDone['清单'])){errs.push('请下载模板修改后，上传两份外接设备附件');}
    var pk=document.querySelectorAll('.picker');
    if(!pk[2]._values().length){errs.push('请选择活动负责老师');}
    if(!document.getElementById('teacherPhone').value){errs.push('请填写活动负责老师联系电话');}
    var box=document.getElementById('errBox');
    if(errs.length){e.preventDefault();box.innerHTML='请先完善：'+errs.join('；');box.style.display='block';window.scrollTo(0,document.body.scrollHeight);}
    else{box.style.display='none';}
  });
})();
</script>

</body>
</html>
