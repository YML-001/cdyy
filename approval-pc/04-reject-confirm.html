<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>审批驳回 - 审批管理 - 智慧学工</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f8fafc;color:#0f172a;min-height:100vh}
a{text-decoration:none;color:inherit}
.topnav{background:#fff;border-bottom:1px solid #e2e8f0;padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:50}
.topnav-brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.topnav-brand .logo{width:28px;height:28px;border-radius:7px;background:#d97706;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.topnav-user{font-size:13px;color:#64748b}
.container{max-width:500px;margin:0 auto;padding:60px 32px;text-align:center}
.result-icon{width:72px;height:72px;border-radius:50%;background:#fef2f2;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:36px}
.result-title{font-size:22px;font-weight:700;color:#dc2626;margin-bottom:6px}
.result-desc{font-size:14px;color:#64748b;margin-bottom:32px}
.info-card{background:#fff;border-radius:10px;border:1px solid #e2e8f0;padding:20px;text-align:left;margin-bottom:24px}
.info-row{display:flex;justify-content:space-between;padding:8px 0;font-size:13.5px;border-bottom:1px solid #f1f5f9}
.info-row:last-child{border-bottom:none}
.il{color:#64748b}
.iv{font-weight:500}
.badge{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:10px;font-weight:500;background:#fef2f2;color:#dc2626}
.reject-reason{background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:12px 14px;font-size:13px;color:#991b1b;margin-top:8px;text-align:left;line-height:1.6}
.reject-reason strong{display:block;font-size:12px;color:#dc2626;margin-bottom:4px}
.btn-row{display:flex;gap:10px;justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 24px;border-radius:8px;font-size:14px;font-weight:500}
.btn-primary{background:#d97706;color:#fff}
.btn-secondary{background:#fff;color:#0f172a;border:1px solid #e2e8f0}
</style>
</head>
<body>

<nav class="topnav">
  <div class="topnav-brand"><div class="logo">审</div>智慧学工 · 审批管理</div>
  <span class="topnav-user">孙瀚 · 管理员</span>
</nav>

<div class="container">
  <div class="result-icon">✕</div>
  <div class="result-title">已驳回</div>
  <div class="result-desc">已通知申请人张三，预约已被驳回</div>

  <div class="info-card">
    <div class="info-row"><span class="il">预约编号</span><span class="iv">B20260415001</span></div>
    <div class="info-row"><span class="il">场地</span><span class="iv">206会议室</span></div>
    <div class="info-row"><span class="il">科室</span><span class="iv">综合办</span></div>
    <div class="info-row"><span class="il">日期</span><span class="iv">2026-04-15</span></div>
    <div class="info-row"><span class="il">时段</span><span class="iv">14:00-15:00</span></div>
    <div class="info-row"><span class="il">申请人</span><span class="iv">张三</span></div>
    <div class="info-row"><span class="il">状态</span><span class="iv"><span class="badge">已驳回</span></span></div>
    <div class="reject-reason">
      <strong>驳回原因</strong>
      该时段已有其他重要会议安排，请更换至当天16:00-17:00或次日14:00-15:00时段。
    </div>
  </div>

  <div class="btn-row">
    <a class="btn btn-secondary" href="05-history.html">审批历史</a>
    <a class="btn btn-primary" href="01-pending-list.html">继续审批</a>
  </div>
</div>

</body>
</html>
