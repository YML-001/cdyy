<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>填写信息 - 发起预约 - 智慧学工</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f5f5;color:#1e293b;max-width:375px;margin:0 auto;min-height:100vh;padding-bottom:80px}
a{text-decoration:none;color:inherit}
.header{background:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #f0f0f0;position:sticky;top:0;z-index:50}
.header .back{font-size:18px;color:#64748b}
.header h1{font-size:16px;font-weight:600;flex:1}
.steps{display:flex;background:#fff;padding:16px;margin-bottom:8px}
.step{flex:1;text-align:center}
.step .snum{width:24px;height:24px;border-radius:50%;background:#e2e8f0;color:#94a3b8;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.step .slabel{font-size:11px;color:#94a3b8;margin-top:3px}
.step.active .snum{background:#4f46e5;color:#fff}
.step.active .slabel{color:#4f46e5;font-weight:500}
.step.done .snum{background:#ecfdf5;color:#059669}
.step.done .slabel{color:#059669}
.section{background:#fff;padding:16px;margin-bottom:8px}
.section h3{font-size:14px;font-weight:600;margin-bottom:14px}
.form-group{margin-bottom:14px}
.form-label{font-size:13px;color:#374151;margin-bottom:5px;display:flex;align-items:center;gap:4px}
.form-label .req{color:#ef4444;font-size:14px}
.form-hint{font-size:11.5px;color:#94a3b8;margin-top:3px}
input[type="text"],input[type="tel"],textarea,select{width:100%;padding:10px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:14px;font-family:inherit;background:#fff}
textarea{height:72px;resize:vertical}
select{appearance:auto}
.checkbox-row{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;font-size:13px;line-height:1.5;color:#92400e}
.checkbox-row input{margin-top:3px;flex-shrink:0}
.bottom-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:375px;background:#fff;border-top:1px solid #e5e7eb;padding:10px 16px env(safe-area-inset-bottom,10px);display:flex;gap:10px;z-index:50}
.btn{flex:1;padding:12px;border-radius:10px;text-align:center;font-size:15px;font-weight:600}
.btn-primary{background:#4f46e5;color:#fff}
.btn-secondary{background:#f1f5f9;color:#64748b}
</style>
</head>
<body>

<div class="header">
  <a class="back" href="03-book-select-venue.html">←</a>
  <h1>填写信息</h1>
</div>

<div class="steps">
  <div class="step done"><div class="snum">✓</div><div class="slabel">选择场地</div></div>
  <div class="step active"><div class="snum">2</div><div class="slabel">填写信息</div></div>
  <div class="step"><div class="snum">3</div><div class="slabel">选择时段</div></div>
  <div class="step"><div class="snum">4</div><div class="slabel">确认提交</div></div>
</div>

<div class="section">
  <h3>117民族团结进步之家 · 民族办表单</h3>

  <div class="form-group">
    <div class="form-label"><span class="req">*</span>使用目的</div>
    <select>
      <option>民族文化交流活动</option>
      <option>民族团结主题教育</option>
      <option>少数民族学生座谈</option>
      <option>其他</option>
    </select>
  </div>

  <div class="form-group">
    <div class="form-label"><span class="req">*</span>活动名称</div>
    <input type="text" value="民族文化体验日">
  </div>

  <div class="form-group">
    <div class="checkbox-row">
      <input type="checkbox" checked>
      <span>我已阅读并同意《场地使用条款》，承诺爱护场地设施，使用后恢复原貌</span>
    </div>
  </div>

  <div class="form-group">
    <div class="form-label"><span class="req">*</span>预约人姓名</div>
    <input type="text" value="张三">
  </div>

  <div class="form-group">
    <div class="form-label"><span class="req">*</span>学院 / 班级</div>
    <input type="text" value="文学与新闻传播学院 汉语言2301">
  </div>

  <div class="form-group">
    <div class="form-label"><span class="req">*</span>预约原因</div>
    <textarea>组织少数民族同学开展民族文化体验交流活动，增进各族同学相互了解。</textarea>
  </div>

  <div class="form-group">
    <div class="form-label">指导老师</div>
    <input type="text" value="刘老师">
    <div class="form-hint">如有指导老师请填写</div>
  </div>
</div>

<div class="bottom-bar">
  <a class="btn btn-secondary" href="03-book-select-venue.html">上一步</a>
  <a class="btn btn-primary" href="06-book-select-slot.html">下一步</a>
</div>

</body>
</html>
