<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>填写信息 - 发起预约 - 智慧学工</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f5f5;color:#1e293b;max-width:375px;margin:0 auto;min-height:100vh;padding-bottom:80px}
a{text-decoration:none;color:inherit}
.header{background:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #f0f0f0;position:sticky;top:0;z-index:50}
.header .back{font-size:18px;color:#64748b}
.header h1{font-size:16px;font-weight:600;flex:1}
.steps{display:flex;background:#fff;padding:16px;margin-bottom:8px}
.step{flex:1;text-align:center}
.step .snum{width:24px;height:24px;border-radius:50%;background:#e2e8f0;color:#94a3b8;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.step .slabel{font-size:11px;color:#94a3b8;margin-top:3px}
.step.active .snum{background:#4f46e5;color:#fff}
.step.active .slabel{color:#4f46e5;font-weight:500}
.step.done .snum{background:#ecfdf5;color:#059669}
.step.done .slabel{color:#059669}
.section{background:#fff;padding:16px;margin-bottom:8px}
.section h3{font-size:14px;font-weight:600;margin-bottom:14px}
.form-group{margin-bottom:14px}
.form-label{font-size:13px;color:#374151;margin-bottom:5px;display:flex;align-items:center;gap:4px}
.form-label .req{color:#ef4444;font-size:14px}
input[type="text"],input[type="tel"],input[type="number"],textarea{width:100%;padding:10px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:14px;font-family:inherit;background:#fff}
textarea{height:72px;resize:vertical}
.bottom-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:375px;background:#fff;border-top:1px solid #e5e7eb;padding:10px 16px env(safe-area-inset-bottom,10px);display:flex;gap:10px;z-index:50}
.btn{flex:1;padding:12px;border-radius:10px;text-align:center;font-size:15px;font-weight:600}
.btn-primary{background:#4f46e5;color:#fff}
.btn-secondary{background:#f1f5f9;color:#64748b}
.guide-card{display:flex;align-items:center;gap:10px;padding:12px;border:2px solid #e2e8f0;border-radius:10px;margin-bottom:8px;cursor:pointer}
.guide-card:hover{border-color:#c7d2fe}
.guide-card.selected{border-color:#4f46e5;background:#f8f7ff}
.guide-avatar{width:36px;height:36px;border-radius:50%;background:#eef2ff;color:#4f46e5;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;flex-shrink:0}
.guide-info{flex:1}
.guide-name{font-size:13.5px;font-weight:600}
.guide-role{font-size:12px;color:#64748b}
.guide-check{width:18px;height:18px;border-radius:50%;border:2px solid #e2e8f0;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent}
.guide-card.selected .guide-check{border-color:#4f46e5;background:#4f46e5;color:#fff}
</style>
</head>
<body>

<div class="header">
  <a class="back" href="03-book-select-venue.html">←</a>
  <h1>填写信息</h1>
</div>

<div class="steps">
  <div class="step done"><div class="snum">✓</div><div class="slabel">选择场地</div></div>
  <div class="step active"><div class="snum">2</div><div class="slabel">填写信息</div></div>
  <div class="step"><div class="snum">3</div><div class="slabel">选择时段</div></div>
  <div class="step"><div class="snum">4</div><div class="slabel">确认提交</div></div>
</div>

<div class="section">
  <h3>206会议室 · 标准预约表单</h3>

  <div class="form-group">
    <div class="form-label"><span class="req">*</span>活动名称</div>
    <input type="text" value="2026年春季学工例会">
  </div>

  <div class="form-group">
    <div class="form-label"><span class="req">*</span>参与人数</div>
    <input type="number" value="30">
  </div>

  <div class="form-group">
    <div class="form-label"><span class="req">*</span>承办单位</div>
    <input type="text" value="学生工作部综合办">
  </div>

  <div class="form-group">
    <div class="form-label"><span class="req">*</span>活动负责老师</div>
    <input type="text" value="王老师">
  </div>

  <div class="form-group">
    <div class="form-label"><span class="req">*</span>负责老师联系方式</div>
    <input type="tel" value="138****5678">
  </div>

  <div class="form-group">
    <div class="form-label"><span class="req">*</span>活动学生负责人</div>
    <input type="text" value="张三">
  </div>

  <div class="form-group">
    <div class="form-label"><span class="req">*</span>学生负责人联系方式</div>
    <input type="tel" value="159****1234">
  </div>

  <div class="form-group">
    <div class="form-label">其他需求说明</div>
    <textarea>投屏器×1、笔记本电脑×1、茶水30杯</textarea>
  </div>
</div>

<div class="section">
  <h3>选择解说员/教练</h3>
  <div style="font-size:12px;color:#94a3b8;margin-bottom:10px">该场地配置了解说员/教练，可按需选择</div>
  <div class="guide-card selected">
    <div class="guide-avatar">王</div>
    <div class="guide-info">
      <div class="guide-name">王解说员</div>
      <div class="guide-role">解说员 · 主讲消防安全</div>
    </div>
    <div class="guide-check">✓</div>
  </div>
  <div class="guide-card">
    <div class="guide-avatar">赵</div>
    <div class="guide-info">
      <div class="guide-name">赵教练</div>
      <div class="guide-role">教练 · 主讲应急逃生</div>
    </div>
    <div class="guide-check">✓</div>
  </div>
  <div class="guide-card" style="justify-content:center;color:#94a3b8;font-size:13px;border-style:dashed">
    不需要解说员/教练
  </div>
</div>

<div class="bottom-bar">
  <a class="btn btn-secondary" href="03-book-select-venue.html">上一步</a>
  <a class="btn btn-primary" href="06-book-select-slot.html">下一步</a>
</div>

</body>
</html>
