<!DOCTYPE html>
<html lang="zh-CN">
<head>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f5f5;color:#1e293b;max-width:375px;margin:0 auto;min-height:100vh;padding-bottom:80px}
a{text-decoration:none;color:inherit}
.header{background:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #f0f0f0;position:sticky;top:0;z-index:50}
.header .back{font-size:18px;color:#64748b}
.header h1{font-size:16px;font-weight:600;flex:1}
.status-banner{background:#fffbeb;padding:16px;text-align:center;border-bottom:1px solid #fde68a}
.status-banner .icon{font-size:28px;margin-bottom:4px}
.status-banner .title{font-size:16px;font-weight:600;color:#d97706}
.status-banner .sub{font-size:12px;color:#92400e;margin-top:3px}
.section{background:#fff;margin:8px 0;padding:14px 16px}
.section h3{font-size:14px;font-weight:600;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #f1f5f9}
.row{display:flex;justify-content:space-between;padding:7px 0;font-size:13px;border-bottom:1px solid #f8fafc}
.row:last-child{border-bottom:none}
.rl{color:#94a3b8}
.rv{font-weight:500;text-align:right;flex:1;margin-left:12px}
.flow{display:flex;align-items:center;gap:4px;font-size:12px;flex-wrap:wrap;padding:4px 0}
.fn{padding:6px 10px;border-radius:6px;font-weight:500}
.fn.done{background:#ecfdf5;color:#059669}
.fn.current{background:#4f46e5;color:#fff}
.fn.pending{background:#f1f5f9;color:#94a3b8}
.fa{color:#cbd5e1}
.bottom-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:375px;background:#fff;border-top:1px solid #e5e7eb;padding:10px 16px env(safe-area-inset-bottom,10px);display:flex;gap:10px;z-index:50}
.btn{flex:1;padding:12px;border-radius:10px;text-align:center;font-size:15px;font-weight:600}
.btn-back{background:#f1f5f9;color:#64748b}
.btn-cancel{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
</style>
</head>
<body>

</html>
