<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>选择时段 - 自由时段 - 智慧学工</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f5f5;color:#1e293b;max-width:375px;margin:0 auto;min-height:100vh;padding-bottom:80px}
a{text-decoration:none;color:inherit}
.header{background:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #f0f0f0;position:sticky;top:0;z-index:50}
.header .back{font-size:18px;color:#64748b}
.header h1{font-size:16px;font-weight:600;flex:1}
.steps{display:flex;background:#fff;padding:16px;margin-bottom:8px}
.step{flex:1;text-align:center}
.step .snum{width:24px;height:24px;border-radius:50%;background:#e2e8f0;color:#94a3b8;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.step .slabel{font-size:11px;color:#94a3b8;margin-top:3px}
.step.active .snum{background:#4f46e5;color:#fff}
.step.active .slabel{color:#4f46e5;font-weight:500}
.step.done .snum{background:#ecfdf5;color:#059669}
.step.done .slabel{color:#059669}
.section{background:#fff;padding:16px;margin-bottom:8px}
.section h3{font-size:14px;font-weight:600;margin-bottom:10px}
.hint-box{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;font-size:12px;color:#64748b;line-height:1.6;margin-bottom:14px}
.form-group{margin-bottom:14px}
.form-label{font-size:13px;color:#374151;margin-bottom:5px;font-weight:500}
input[type="date"],select{width:100%;padding:10px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:14px;font-family:inherit;background:#fff}
.time-row{display:flex;align-items:center;gap:8px}
.time-row select{flex:1}
.time-row .sep{font-size:14px;color:#94a3b8;font-weight:500;flex-shrink:0}
.dur-tag{background:#eef2ff;border:1px solid #c7d2fe;border-radius:8px;padding:8px 12px;font-size:12.5px;color:#4f46e5;margin-top:4px;text-align:center;font-weight:500}
.occ-title{font-size:13px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.occ-title .count{font-size:10px;padding:2px 6px;border-radius:10px;background:#fef2f2;color:#dc2626;font-weight:500}
.occ-list{border:1px solid #e2e8f0;border-radius:8px;overflow:hidden}
.occ-item{display:flex;align-items:center;padding:10px 12px;font-size:12.5px;border-bottom:1px solid #f1f5f9}
.occ-item:last-child{border-bottom:none}
.occ-item .ot{color:#dc2626;font-weight:500;min-width:100px}
.occ-item .ou{color:#64748b;flex:1}
.occ-note{font-size:11px;color:#94a3b8;margin-top:6px}
.bottom-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:375px;background:#fff;border-top:1px solid #e5e7eb;padding:10px 16px env(safe-area-inset-bottom,10px);display:flex;gap:10px;z-index:50}
.btn{flex:1;padding:12px;border-radius:10px;text-align:center;font-size:15px;font-weight:600}
.btn-primary{background:#4f46e5;color:#fff}
.btn-secondary{background:#f1f5f9;color:#64748b}
</style>
</head>
<body>

<div class="header">
  <a class="back" href="04-book-form-standard.html">←</a>
  <h1>填写时段</h1>
</div>

<div class="steps">
  <div class="step done"><div class="snum">✓</div><div class="slabel">选择场地</div></div>
  <div class="step done"><div class="snum">✓</div><div class="slabel">填写信息</div></div>
  <div class="step active"><div class="snum">3</div><div class="slabel">选择时段</div></div>
  <div class="step"><div class="snum">4</div><div class="slabel">确认提交</div></div>
</div>

<div class="section">
  <h3>自由时段</h3>
  <div class="hint-box">
    ✏️ 本场地分上午（8:00-12:00）、下午（14:00-18:00）开放，请在开放时段内选择，不可跨午休。<br>
    最短 30 分钟，最长 4 小时。系统会自动检测冲突。
  </div>

  <div class="form-group">
    <div class="form-label">预约日期</div>
    <input type="date" value="2026-04-15">
  </div>

  <div class="form-group">
    <div class="form-label">使用时段</div>
    <div class="time-row">
      <select>
        <optgroup label="上午 (8:00-12:00)">
          <option>08:00</option>
          <option>08:30</option>
          <option>09:00</option>
          <option>09:30</option>
          <option>10:00</option>
          <option>10:30</option>
          <option>11:00</option>
          <option>11:30</option>
        </optgroup>
        <optgroup label="下午 (14:00-18:00)">
          <option selected>14:00</option>
          <option>14:30</option>
          <option>15:00</option>
          <option>15:30</option>
          <option>16:00</option>
          <option>16:30</option>
          <option>17:00</option>
          <option>17:30</option>
        </optgroup>
      </select>
      <span class="sep">至</span>
      <select>
        <optgroup label="上午 (8:00-12:00)">
          <option>08:30</option>
          <option>09:00</option>
          <option>09:30</option>
          <option>10:00</option>
          <option>10:30</option>
          <option>11:00</option>
          <option>11:30</option>
          <option>12:00</option>
        </optgroup>
        <optgroup label="下午 (14:00-18:00)">
          <option>14:30</option>
          <option>15:00</option>
          <option>15:30</option>
          <option>16:00</option>
          <option selected>16:30</option>
          <option>17:00</option>
          <option>17:30</option>
          <option>18:00</option>
        </optgroup>
      </select>
    </div>
    <div class="dur-tag">⏱ 已选时长：2 小时 30 分钟</div>
  </div>
</div>

<div class="section">
  <h3>当日已有预约</h3>
  <div class="occ-title">4月15日 <span class="count">3 条</span></div>
  <div class="occ-list">
    <div class="occ-item"><span class="ot">09:00-11:00</span><span class="ou">张老师 · 团辅</span></div>
    <div class="occ-item"><span class="ot">11:00-12:00</span><span class="ou">李同学 · 心理咨询</span></div>
    <div class="occ-item"><span class="ot">16:30-18:00</span><span class="ou">王老师 · 培训讲座</span></div>
  </div>
  <div class="occ-note">如所选时段与已有预约冲突，提交时将提示并拒绝</div>
</div>

<div class="bottom-bar">
  <a class="btn btn-secondary" href="04-book-form-standard.html">上一步</a>
  <a class="btn btn-primary" href="07-book-confirm.html">下一步</a>
</div>

</body>
</html>
