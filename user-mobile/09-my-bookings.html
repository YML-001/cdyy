<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>我的预约 - 智慧学工</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f5f5;color:#1e293b;max-width:375px;margin:0 auto;min-height:100vh;padding-bottom:60px}
a{text-decoration:none;color:inherit}
.header{background:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f0f0f0;position:sticky;top:0;z-index:50}
.header h1{font-size:17px;font-weight:600}
.status-tabs{display:flex;background:#fff;padding:0 16px;border-bottom:1px solid #f0f0f0}
.status-tab{flex:1;text-align:center;padding:10px 0;font-size:13.5px;color:#94a3b8;border-bottom:2px solid transparent}
.status-tab.active{color:#4f46e5;font-weight:600;border-bottom-color:#4f46e5}
.booking-list{padding:12px}
.booking-card{display:block;background:#fff;border-radius:10px;padding:14px;margin-bottom:10px;border:1px solid #e2e8f0}
.bc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.bc-venue{font-size:15px;font-weight:600}
.bc-badge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:500}
.bc-badge.pending{background:#fffbeb;color:#d97706}
.bc-badge.approved{background:#ecfdf5;color:#059669}
.bc-badge.rejected{background:#fef2f2;color:#dc2626}
.bc-info{font-size:12.5px;color:#64748b;line-height:1.8}
.bc-info span{display:block}
.bc-footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid #f1f5f9}
.bc-id{font-size:11.5px;color:#94a3b8}
.bc-action{font-size:12.5px;color:#4f46e5;font-weight:500}
.tab-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:375px;background:#fff;border-top:1px solid #e5e7eb;display:flex;padding:6px 0 env(safe-area-inset-bottom,8px);z-index:50}
.tab-bar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:#94a3b8;padding:4px 0}
.tab-bar a.active{color:#4f46e5}
.tab-bar a .ticon{font-size:18px}
</style>
</head>
<body>

<div class="header">
  <h1>我的预约</h1>
</div>

<div class="status-tabs">
  <div class="status-tab active">全部</div>
  <div class="status-tab">待审批</div>
  <div class="status-tab">已通过</div>
  <div class="status-tab">已驳回</div>
</div>

<div class="booking-list">
  <a class="booking-card" href="10-booking-detail-pending.html">
    <div class="bc-top"><span class="bc-venue">206会议室</span><span class="bc-badge pending">待审批</span></div>
    <div class="bc-info">
      <span>📅 2026-04-15 · 14:00-15:00</span>
      <span>📝 2026年春季学工例会</span>
    </div>
    <div class="bc-footer"><span class="bc-id">B20260415001</span><span class="bc-action">查看详情 →</span></div>
  </a>

  <a class="booking-card" href="11-booking-detail-approved.html">
    <div class="bc-top"><span class="bc-venue">238云麓阁报告厅</span><span class="bc-badge approved">已通过</span></div>
    <div class="bc-info">
      <span>📅 2026-04-12 · 09:00-11:00</span>
      <span>📝 学生干部培训会</span>
    </div>
    <div class="bc-footer"><span class="bc-id">B20260412002</span><span class="bc-action">查看详情 →</span></div>
  </a>

  <a class="booking-card" href="10-booking-detail-pending.html">
    <div class="bc-top"><span class="bc-venue">知新馆（团辅B）</span><span class="bc-badge rejected">已驳回</span></div>
    <div class="bc-info">
      <span>📅 2026-04-10 · 3-4节</span>
      <span>📝 班级团体心理辅导</span>
    </div>
    <div class="bc-footer"><span class="bc-id">B20260410003</span><span class="bc-action">查看详情 →</span></div>
  </a>
</div>

<nav class="tab-bar">
  <a href="01-venue-list.html"><span class="ticon">🏠</span>场地</a>
  <a class="active" href="09-my-bookings.html"><span class="ticon">📋</span>我的预约</a>
</nav>

</body>
</html>
