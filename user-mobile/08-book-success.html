<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>预约成功 - 智慧学工</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f5f5;color:#1e293b;max-width:375px;margin:0 auto;min-height:100vh;padding-bottom:70px}
a{text-decoration:none;color:inherit}
.header{background:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #f0f0f0;position:sticky;top:0;z-index:50}
.header h1{font-size:16px;font-weight:600;flex:1;text-align:center}
.success-area{padding:40px 24px 24px;text-align:center}
.success-icon{width:64px;height:64px;border-radius:50%;background:#ecfdf5;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:30px}
.success-title{font-size:20px;font-weight:700;color:#059669;margin-bottom:6px}
.success-desc{font-size:13px;color:#64748b}
.info-card{background:#fff;margin:16px;border-radius:10px;padding:16px;border:1px solid #e2e8f0}
.info-row{display:flex;justify-content:space-between;padding:7px 0;font-size:13px;border-bottom:1px solid #f8fafc}
.info-row:last-child{border-bottom:none}
.il{color:#94a3b8}
.iv{font-weight:500}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:500;background:#fffbeb;color:#d97706}
.btn-group{padding:0 16px;display:flex;flex-direction:column;gap:10px;margin-top:20px}
.btn{padding:13px;border-radius:10px;text-align:center;font-size:15px;font-weight:600}
.btn-primary{background:#4f46e5;color:#fff}
.btn-outline{background:#fff;color:#4f46e5;border:1px solid #4f46e5}
.tab-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:375px;background:#fff;border-top:1px solid #e5e7eb;display:flex;padding:6px 0 env(safe-area-inset-bottom,8px);z-index:50}
.tab-bar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:#94a3b8;padding:4px 0}
.tab-bar a.active{color:#4f46e5}
.tab-bar a .ticon{font-size:18px}
</style>
</head>
<body>

<div class="header">
  <h1>预约结果</h1>
</div>

<div class="success-area">
  <div class="success-icon">✓</div>
  <div class="success-title">预约提交成功</div>
  <div class="success-desc">您的预约已提交，等待管理员审批</div>
</div>

<div class="info-card">
  <div class="info-row"><span class="il">预约编号</span><span class="iv">B20260415001</span></div>
  <div class="info-row"><span class="il">场地</span><span class="iv">206会议室</span></div>
  <div class="info-row"><span class="il">日期</span><span class="iv">2026-04-15</span></div>
  <div class="info-row"><span class="il">时段</span><span class="iv">14:00-15:00</span></div>
  <div class="info-row"><span class="il">活动</span><span class="iv">2026年春季学工例会</span></div>
  <div class="info-row"><span class="il">状态</span><span class="iv"><span class="badge">待审批</span></span></div>
</div>

<div class="btn-group">
  <a class="btn btn-primary" href="09-my-bookings.html">查看我的预约</a>
  <a class="btn btn-outline" href="01-venue-list.html">继续预约</a>
</div>

<nav class="tab-bar">
  <a href="01-venue-list.html"><span class="ticon">🏠</span>场地</a>
  <a href="09-my-bookings.html"><span class="ticon">📋</span>我的预约</a>
</nav>

</body>
</html>
