<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>选择时段 - 半天制 - 智慧学工</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f5f5;color:#1e293b;max-width:375px;margin:0 auto;min-height:100vh;padding-bottom:80px}
a{text-decoration:none;color:inherit}
.header{background:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #f0f0f0;position:sticky;top:0;z-index:50}
.header .back{font-size:18px;color:#64748b}
.header h1{font-size:16px;font-weight:600;flex:1}
.steps{display:flex;background:#fff;padding:16px;margin-bottom:8px}
.step{flex:1;text-align:center}
.step .snum{width:24px;height:24px;border-radius:50%;background:#e2e8f0;color:#94a3b8;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.step .slabel{font-size:11px;color:#94a3b8;margin-top:3px}
.step.active .snum{background:#4f46e5;color:#fff}
.step.active .slabel{color:#4f46e5;font-weight:500}
.step.done .snum{background:#ecfdf5;color:#059669}
.step.done .slabel{color:#059669}
.section{background:#fff;padding:16px;margin-bottom:8px}
.section h3{font-size:14px;font-weight:600;margin-bottom:12px}
.date-scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px}
.date-item{flex-shrink:0;width:52px;padding:8px 4px;border-radius:8px;text-align:center;border:1px solid #e2e8f0;background:#fff}
.date-item .dw{font-size:10px;color:#94a3b8}
.date-item .dd{font-size:15px;font-weight:600;margin:2px 0}
.date-item .dm{font-size:9px;color:#94a3b8}
.date-item.active{background:#4f46e5;border-color:#4f46e5;color:#fff}
.date-item.active .dw,.date-item.active .dm{color:rgba(255,255,255,.7)}
.hd-list{display:flex;flex-direction:column;gap:10px}
.hd-card{border:2px solid #e2e8f0;border-radius:14px;padding:20px 16px;display:flex;align-items:center;gap:14px}
.hd-card .hd-icon{font-size:28px;flex-shrink:0}
.hd-card .hd-info{flex:1}
.hd-card .hd-name{font-size:16px;font-weight:700;margin-bottom:2px}
.hd-card .hd-time{font-size:13px;color:#64748b}
.hd-card .hd-dur{font-size:11px;color:#94a3b8;margin-top:1px}
.hd-card .hd-status{font-size:11px;padding:4px 12px;border-radius:20px;font-weight:500;flex-shrink:0}
.hd-card .hd-status.avail{background:#ecfdf5;color:#059669}
.hd-card .hd-status.busy{background:#fef2f2;color:#dc2626}
.hd-card.selected{border-color:#4f46e5;background:#f8f7ff}
.hd-card.selected .hd-status{background:#eef2ff;color:#4f46e5}
.hd-card.disabled{opacity:.45}
.legend{display:flex;gap:12px;margin-top:14px;font-size:10px;color:#94a3b8}
.legend span{display:flex;align-items:center;gap:3px}
.legend .dot{width:8px;height:8px;border-radius:2px;border:1px solid #e2e8f0}
.legend .dot.sel{background:#4f46e5;border-color:#4f46e5}
.legend .dot.dis{background:#f1f5f9}
.bottom-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:375px;background:#fff;border-top:1px solid #e5e7eb;padding:10px 16px env(safe-area-inset-bottom,10px);display:flex;gap:10px;z-index:50}
.btn{flex:1;padding:12px;border-radius:10px;text-align:center;font-size:15px;font-weight:600}
.btn-primary{background:#4f46e5;color:#fff}
.btn-secondary{background:#f1f5f9;color:#64748b}
</style>
</head>
<body>

<div class="header">
  <a class="back" href="04-book-form-standard.html">←</a>
  <h1>选择时段</h1>
</div>

<div class="steps">
  <div class="step done"><div class="snum">✓</div><div class="slabel">选择场地</div></div>
  <div class="step done"><div class="snum">✓</div><div class="slabel">填写信息</div></div>
  <div class="step active"><div class="snum">3</div><div class="slabel">选择时段</div></div>
  <div class="step"><div class="snum">4</div><div class="slabel">确认提交</div></div>
</div>

<div class="section">
  <h3>选择日期</h3>
  <div class="date-scroll">
    <div class="date-item"><div class="dw">周三</div><div class="dd">9</div><div class="dm">4月</div></div>
    <div class="date-item"><div class="dw">周四</div><div class="dd">10</div><div class="dm">4月</div></div>
    <div class="date-item"><div class="dw">周五</div><div class="dd">11</div><div class="dm">4月</div></div>
    <div class="date-item"><div class="dw">周六</div><div class="dd">12</div><div class="dm">4月</div></div>
    <div class="date-item"><div class="dw">周日</div><div class="dd">13</div><div class="dm">4月</div></div>
    <div class="date-item"><div class="dw">周一</div><div class="dd">14</div><div class="dm">4月</div></div>
    <div class="date-item active"><div class="dw">周二</div><div class="dd">15</div><div class="dm">4月</div></div>
    <div class="date-item"><div class="dw">周三</div><div class="dd">16</div><div class="dm">4月</div></div>
  </div>
</div>

<div class="section">
  <h3>选择时段（半天制）</h3>
  <div style="font-size:11.5px;color:#94a3b8;margin-bottom:10px">以下时段即为本场地的开放时段</div>
  <div class="hd-list">
    <div class="hd-card selected">
      <div class="hd-icon">🌅</div>
      <div class="hd-info">
        <div class="hd-name">上午</div>
        <div class="hd-time">8:00 — 12:00</div>
        <div class="hd-dur">4 小时</div>
      </div>
      <div class="hd-status avail">已选择</div>
    </div>
    <div class="hd-card disabled">
      <div class="hd-icon">☀️</div>
      <div class="hd-info">
        <div class="hd-name">下午</div>
        <div class="hd-time">13:00 — 17:00</div>
        <div class="hd-dur">4 小时</div>
      </div>
      <div class="hd-status busy">已占用</div>
    </div>
    <div class="hd-card">
      <div class="hd-icon">🌙</div>
      <div class="hd-info">
        <div class="hd-name">晚间</div>
        <div class="hd-time">18:00 — 21:00</div>
        <div class="hd-dur">3 小时</div>
      </div>
      <div class="hd-status avail">可预约</div>
    </div>
  </div>
  <div class="legend">
    <span><span class="dot"></span>可选</span>
    <span><span class="dot sel"></span>已选</span>
    <span><span class="dot dis"></span>不可选</span>
    <span style="margin-left:auto">每天 3 个时段</span>
  </div>
</div>

<div class="bottom-bar">
  <a class="btn btn-secondary" href="04-book-form-standard.html">上一步</a>
  <a class="btn btn-primary" href="07-book-confirm.html">下一步</a>
</div>

</body>
</html>
