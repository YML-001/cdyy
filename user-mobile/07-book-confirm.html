<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>确认提交 - 发起预约 - 智慧学工</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f5f5;color:#1e293b;max-width:375px;margin:0 auto;min-height:100vh;padding-bottom:80px}
a{text-decoration:none;color:inherit}
.header{background:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #f0f0f0;position:sticky;top:0;z-index:50}
.header .back{font-size:18px;color:#64748b}
.header h1{font-size:16px;font-weight:600;flex:1}
.steps{display:flex;background:#fff;padding:16px;margin-bottom:8px}
.step{flex:1;text-align:center}
.step .snum{width:24px;height:24px;border-radius:50%;background:#e2e8f0;color:#94a3b8;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.step .slabel{font-size:11px;color:#94a3b8;margin-top:3px}
.step.active .snum{background:#4f46e5;color:#fff}
.step.active .slabel{color:#4f46e5;font-weight:500}
.step.done .snum{background:#ecfdf5;color:#059669}
.step.done .slabel{color:#059669}
.section{background:#fff;padding:16px;margin-bottom:8px}
.section h3{font-size:14px;font-weight:600;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #f1f5f9}
.row{display:flex;justify-content:space-between;padding:8px 0;font-size:13.5px;border-bottom:1px solid #f8fafc}
.row:last-child{border-bottom:none}
.rl{color:#94a3b8;flex-shrink:0}
.rv{font-weight:500;text-align:right;flex:1;margin-left:12px}
.flow-info{background:#eef2ff;border:1px solid #c7d2fe;border-radius:8px;padding:12px;font-size:12.5px;color:#4338ca;margin-top:8px;line-height:1.6}
.bottom-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:375px;background:#fff;border-top:1px solid #e5e7eb;padding:10px 16px env(safe-area-inset-bottom,10px);display:flex;gap:10px;z-index:50}
.btn{flex:1;padding:12px;border-radius:10px;text-align:center;font-size:15px;font-weight:600}
.btn-primary{background:#4f46e5;color:#fff}
.btn-secondary{background:#f1f5f9;color:#64748b}
</style>
</head>
<body>

<div class="header">
  <a class="back" href="06-book-select-slot.html">←</a>
  <h1>确认提交</h1>
</div>

<div class="steps">
  <div class="step done"><div class="snum">✓</div><div class="slabel">选择场地</div></div>
  <div class="step done"><div class="snum">✓</div><div class="slabel">填写信息</div></div>
  <div class="step done"><div class="snum">✓</div><div class="slabel">选择时段</div></div>
  <div class="step active"><div class="snum">4</div><div class="slabel">确认提交</div></div>
</div>

<div class="section">
  <h3>场地与时段</h3>
  <div class="row"><span class="rl">场地</span><span class="rv">206会议室</span></div>
  <div class="row"><span class="rl">日期</span><span class="rv">2026-04-15</span></div>
  <div class="row"><span class="rl">时段</span><span class="rv">14:00-15:00</span></div>
</div>

<div class="section">
  <h3>预约信息</h3>
  <div class="row"><span class="rl">活动名称</span><span class="rv">2026年春季学工例会</span></div>
  <div class="row"><span class="rl">参与人数</span><span class="rv">30人</span></div>
  <div class="row"><span class="rl">承办单位</span><span class="rv">学生工作部综合办</span></div>
  <div class="row"><span class="rl">负责老师</span><span class="rv">王老师</span></div>
  <div class="row"><span class="rl">老师电话</span><span class="rv">138****5678</span></div>
  <div class="row"><span class="rl">学生负责人</span><span class="rv">张三</span></div>
  <div class="row"><span class="rl">学生电话</span><span class="rv">159****1234</span></div>
  <div class="row"><span class="rl">其他需求</span><span class="rv">投屏器×1、笔记本电脑×1、茶水30杯</span></div>
  <div class="row"><span class="rl">解说员/教练</span><span class="rv">王解说员（解说员）</span></div>
</div>

<div class="section">
  <h3>审批流程</h3>
  <div class="flow-info">提交后将由 <strong>孙瀚（管理员）</strong> 进行审批，请留意通知消息</div>
  <div style="background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:10px 12px;font-size:12.5px;color:#92400e;margin-top:8px;display:flex;align-items:center;gap:6px">
    <span>📋</span>该场地已启用预约须知，提交前需阅读确认
  </div>
</div>

<div class="bottom-bar">
  <a class="btn btn-secondary" href="06-book-select-slot.html">上一步</a>
  <a class="btn btn-primary" href="07-book-confirm-agreement.html">确认提交</a>
</div>

</body>
</html>
