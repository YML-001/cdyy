<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>填写信息（团委场地）- 发起预约 - 智慧学工</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f5f5;color:#1e293b;max-width:375px;margin:0 auto;min-height:100vh;padding-bottom:80px}
a{text-decoration:none;color:inherit}
.header{background:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #f0f0f0;position:sticky;top:0;z-index:50}
.header .back{font-size:18px;color:#64748b}
.header h1{font-size:16px;font-weight:600;flex:1}
.steps{display:flex;background:#fff;padding:16px;margin-bottom:8px}
.step{flex:1;text-align:center}
.step .snum{width:24px;height:24px;border-radius:50%;background:#e2e8f0;color:#94a3b8;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.step .slabel{font-size:11px;color:#94a3b8;margin-top:3px}
.step.active .snum{background:#4f46e5;color:#fff}
.step.active .slabel{color:#4f46e5;font-weight:500}
.step.done .snum{background:#ecfdf5;color:#059669}
.step.done .slabel{color:#059669}
.section{background:#fff;padding:16px;margin-bottom:8px}
.section h3{font-size:14px;font-weight:600;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #f1f5f9}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:500;color:#1e293b;margin-bottom:4px}
.field label .req{color:#dc2626;margin-left:2px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:14px;font-family:inherit;color:#1e293b;background:#fff}
.field textarea{min-height:72px;resize:vertical}
.field .hint{font-size:11px;color:#94a3b8;margin-top:3px}
.nature-opts{display:flex;flex-wrap:wrap;gap:8px;padding:4px 0}
.nature-opt{padding:8px 14px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;cursor:pointer}
.nature-opt.checked{border-color:#4f46e5;background:#eef2ff;color:#4f46e5;font-weight:500}
.equip-list{display:flex;flex-direction:column;gap:8px}
.equip-card{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid #e2e8f0;border-radius:10px;font-size:13.5px}
.equip-card.checked{border-color:#4f46e5;background:#f8f7ff}
.equip-card input[type="checkbox"]{width:18px;height:18px;accent-color:#4f46e5;flex-shrink:0}
.equip-card .ename{flex:1}
.equip-card .qty-wrap{display:flex;align-items:center;gap:6px;font-size:12px;color:#64748b}
.equip-card .qty-wrap input{width:50px;padding:4px 6px;border:1px solid #c7d2fe;border-radius:6px;font-size:13px;text-align:center}
.equip-hint{font-size:11px;color:#94a3b8;margin-top:8px}
.bottom-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:375px;background:#fff;border-top:1px solid #e5e7eb;padding:10px 16px env(safe-area-inset-bottom,10px);display:flex;gap:10px;z-index:50}
.btn{flex:1;padding:12px;border-radius:10px;text-align:center;font-size:15px;font-weight:600}
.btn-primary{background:#4f46e5;color:#fff}
.btn-secondary{background:#f1f5f9;color:#64748b}
.pick{display:flex;align-items:center;flex-wrap:wrap;gap:4px;min-height:42px;padding:6px 26px 6px 10px;border:1px solid #e2e8f0;border-radius:8px;background:#fff;position:relative}
.pk-chip{padding:2px 8px;border-radius:6px;background:#eef2ff;color:#4338ca;font-size:13px}
.pk-chip small{color:#64748b;font-size:11px}
.pk-ph{color:#94a3b8;font-size:14px}
.pk-arrow{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:18px}
.shot-add{padding:12px;border:1px dashed #cbd5e1;border-radius:8px;font-size:13px;color:#475569;text-align:center}
.tpl-row{margin-top:8px;padding:10px;border:1px solid #e2e8f0;border-radius:8px;background:#f8fafc}
.tpl-name{font-size:13px;line-height:1.5}
.tpl-acts{display:flex;gap:8px;margin-top:8px}
.tpl-dl,.tpl-up{font-size:12.5px;padding:4px 10px;border-radius:6px;border:1px solid #c7d2fe;background:#fff;color:#4f46e5;font-family:inherit}
.tpl-done{margin-top:6px;font-size:12px;color:#059669}
.shot-img{width:120px;height:72px;border-radius:6px;background:linear-gradient(135deg,#bfdbfe,#3b82f6)}
.field input.bad{border-color:#fca5a5;background:#fef2f2}
.err-box{display:none;margin:0 12px 12px;padding:10px 12px;border-radius:8px;background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;font-size:13px}
.sheet-mask{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;z-index:100}
.sheet-mask.show{display:block}
.sheet{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:375px;max-height:70vh;background:#fff;border-radius:14px 14px 0 0;display:flex;flex-direction:column}
.sheet-head{display:flex;justify-content:space-between;padding:14px 16px;font-size:15px;font-weight:600;border-bottom:1px solid #f1f5f9}
.sheet-head b{color:#4f46e5;font-weight:500}
.sheet-search{margin:10px 16px;padding:9px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:14px}
.sheet-list{overflow:auto;padding-bottom:12px}
.sheet-opt{display:flex;align-items:center;padding:12px 16px;font-size:14px;border-bottom:1px solid #f8fafc}
.sheet-opt small{margin-left:8px;color:#94a3b8;font-size:12px}
.sheet-opt i{margin-left:auto;color:#4f46e5;font-style:normal;visibility:hidden}
.sheet-opt.on i{visibility:visible}
.sheet-opt.on{color:#4f46e5}
</style>
</head>
<body>

<div class="header">
  <a class="back" href="03-book-select-venue.html">←</a>
  <h1>填写预约信息</h1>
</div>

<div class="steps">
  <div class="step done"><div class="snum">✓</div><div class="slabel">选择场地</div></div>
  <div class="step active"><div class="snum">2</div><div class="slabel">填写信息</div></div>
  <div class="step"><div class="snum">3</div><div class="slabel">选择时段</div></div>
  <div class="step"><div class="snum">4</div><div class="slabel">确认提交</div></div>
</div>

<div class="section">
  <h3>活动基础信息</h3>
  <div class="field">
    <label>活动名称<span class="req">*</span></label>
    <input type="text" value="2026年校园歌手大赛决赛">
  </div>
  <div class="field">
    <label>活动性质<span class="req">*</span></label>
    <div class="nature-opts" id="natureOpts">
      <span class="nature-opt checked">文艺演出或晚会</span>
      <span class="nature-opt">会议</span>
      <span class="nature-opt">竞赛</span>
      <span class="nature-opt">哲学社科理论类讲座</span>
      <span class="nature-opt">其他</span>
    </div>
  </div>
  <div class="field" id="shotField" style="display:none">
    <label>审核通过界面截图<span class="req">*</span></label>
    <div class="shot-add" id="shotAdd">＋ 上传「哲学社科理论类论坛申请」审核通过截图</div>
  </div>
  <div class="field">
    <label>是否需要外接设备<span class="req">*</span></label>
    <div class="nature-opts" id="extOpts">
      <span class="nature-opt">是</span>
      <span class="nature-opt checked">否</span>
    </div>
  </div>
  <div class="field" id="extFiles" style="display:none">
    <label>外接设备附件<span class="req">*</span></label>
    <div class="hint">请先下载模板，修改后再上传，两份都要上传。</div>
    <div class="tpl-row" data-file="承诺书">
      <div class="tpl-name">附件1 租赁设备进场安全管理承诺书.docx</div>
      <div class="tpl-acts"><a class="tpl-dl" href="../templates/附件1 租赁设备进场安全管理承诺书.docx" download>下载模板</a><button type="button" class="tpl-up">上传</button></div>
      <div class="tpl-done"></div>
    </div>
    <div class="tpl-row" data-file="清单">
      <div class="tpl-name">附件2 租赁设备进场清单.docx</div>
      <div class="tpl-acts"><a class="tpl-dl" href="../templates/附件2 租赁设备进场清单.docx" download>下载模板</a><button type="button" class="tpl-up">上传</button></div>
      <div class="tpl-done"></div>
    </div>
  </div>
  <div class="field">
    <label>主办单位<span class="req">*</span></label>
    <div class="pick" data-kind="dept" data-multi="1" data-val="党委学生工作部（学生工作处）"></div>
  </div>
  <div class="field">
    <label>承办单位<span class="req">*</span></label>
    <div class="pick" data-kind="dept" data-multi="1" data-val="校学生会"></div>
  </div>
  <div class="field">
    <label>预估人数<span class="req">*</span></label>
    <input type="number" id="headcount" value="600">
    <div class="hint" id="capHint"></div>
  </div>
  <div class="field">
    <label>拟邀请嘉宾</label>
    <textarea>校党委副书记、各学院团委书记</textarea>
  </div>
</div>

<div class="section">
  <h3>负责人信息</h3>
  <div class="field">
    <label>活动负责老师<span class="req">*</span></label>
    <div class="pick" data-kind="user" data-phone="teacherPhone"></div>
    <div class="hint">活动当天现场负责人；同时为审批第一步的审批人</div>
  </div>
  <div class="field">
    <label>负责老师联系电话<span class="req">*</span></label>
    <input type="tel" id="teacherPhone" placeholder="请输入联系电话">
  </div>
  <div class="field">
    <label>联络人<span class="req">*</span></label>
    <div class="pick" data-kind="user" data-phone="contactPhone" data-val="张三"></div>
  </div>
  <div class="field">
    <label>联络人联系电话<span class="req">*</span></label>
    <input type="tel" id="contactPhone" value="159****1234">
  </div>
  <div class="field">
    <label>备注信息</label>
    <textarea placeholder="请输入备注信息"></textarea>
  </div>
</div>

<div class="err-box" id="errBox"></div>

<div class="sheet-mask" id="sheetMask">
  <div class="sheet">
    <div class="sheet-head"><span id="sheetTitle">选择</span><b id="sheetDone">完成</b></div>
    <input class="sheet-search" id="sheetSearch" placeholder="搜索">
    <div class="sheet-list" id="sheetList"></div>
  </div>
</div>

<div class="bottom-bar">
  <a class="btn btn-secondary" href="03-book-select-venue.html">上一步</a>
  <a class="btn btn-primary" id="nextBtn" href="06-book-slot-halfday.html">下一步</a>
</div>

<script>
(function(){
  var CAP=512;
  var DEPTS=['党委学生工作部（学生工作处）','校团委','党委宣传部','保卫部','校学生会','校研究生会','文学院','计算机学院','商学院','法学院'];
  var USERS=[['王老师','T20080112','校团委','138****5678'],['王强','T20050021','校团委','137****0021'],['陈建国','T20010007','学生工作部','139****0007'],['张三','S20230101','计算机学院','159****1234'],['李思远','S20230211','文学院','139****1234']];
  function single(group,cb){
    Array.prototype.forEach.call(group.querySelectorAll('.nature-opt'),function(o){
      o.onclick=function(){Array.prototype.forEach.call(group.querySelectorAll('.nature-opt'),function(x){x.classList.remove('checked');});o.classList.add('checked');if(cb){cb(o.textContent);}};
    });
  }
  single(document.getElementById('natureOpts'),function(v){document.getElementById('shotField').style.display=v==='哲学社科理论类讲座'?'':'none';});
  single(document.getElementById('extOpts'),function(){
    var yes=document.querySelector('#extOpts .nature-opt.checked').textContent==='是';
    document.getElementById('extFiles').style.display=yes?'':'none';
  });
  var extDone={};
  Array.prototype.forEach.call(document.querySelectorAll('.tpl-up'),function(btn){
    btn.onclick=function(){
      var row=btn.closest('.tpl-row');
      extDone[row.dataset.file]=true;
      row.querySelector('.tpl-done').textContent='已上传：附件'+row.dataset.file+'（已填写）.docx';
      btn.textContent='重新上传';
    };
  });
  var shotDone=false;
  document.getElementById('shotAdd').onclick=function(){shotDone=true;this.className='shot-img';this.textContent='';};

  var mask=document.getElementById('sheetMask'),slist=document.getElementById('sheetList'),search=document.getElementById('sheetSearch'),cur=null;
  function show(p){
    p.el.innerHTML=p.vals.length?p.vals.map(function(v){return '<span class="pk-chip">'+(p.user?v[0]+' <small>'+v[2]+'</small>':v)+'</span>';}).join(''):'<span class="pk-ph">'+(p.user?'点击搜索用户':'点击选择部门（可多选）')+'</span>';
    p.el.insertAdjacentHTML('beforeend','<span class="pk-arrow">›</span>');
  }
  function renderList(){
    var q=search.value.trim(),p=cur;
    var src=p.user?USERS.filter(function(u){return !q||u[0].indexOf(q)>-1||u[1].indexOf(q)>-1;}):DEPTS.filter(function(d){return !q||d.indexOf(q)>-1;});
    slist.innerHTML=src.map(function(x,i){
      var on=p.user?(p.vals[0]&&p.vals[0][0]===x[0]):p.vals.indexOf(x)>-1;
      return '<div class="sheet-opt'+(on?' on':'')+'" data-i="'+i+'">'+(p.user?x[0]+'<small>'+x[1]+' · '+x[2]+'</small>':x)+'<i>✓</i></div>';
    }).join('')||'<div class="pk-ph" style="padding:16px">无匹配结果</div>';
    Array.prototype.forEach.call(slist.querySelectorAll('.sheet-opt'),function(o){
      o.onclick=function(){
        var x=src[+o.dataset.i];
        if(p.user){p.vals=[x];var ph=document.getElementById(p.el.dataset.phone);if(ph){ph.value=x[3];}close();return;}
        var k=p.vals.indexOf(x);if(k>-1){p.vals.splice(k,1);}else{p.vals.push(x);}renderList();
      };
    });
  }
  function close(){mask.classList.remove('show');show(cur);}
  document.getElementById('sheetDone').onclick=close;
  mask.onclick=function(e){if(e.target===mask){close();}};
  search.oninput=renderList;
  var picks=Array.prototype.map.call(document.querySelectorAll('.pick'),function(el){
    var p={el:el,user:el.dataset.kind==='user',vals:[]};
    if(el.dataset.val){p.vals=p.user?USERS.filter(function(u){return u[0]===el.dataset.val;}):[el.dataset.val];}
    el.onclick=function(){cur=p;search.value='';document.getElementById('sheetTitle').textContent=p.user?'搜索用户':'选择部门';renderList();mask.classList.add('show');};
    show(p);return p;
  });

  var hc=document.getElementById('headcount'),capHint=document.getElementById('capHint');
  function checkCap(){
    var over=+hc.value>CAP;
    hc.classList.toggle('bad',over);
    capHint.textContent=over?'超过场地容纳人数（'+CAP+'人），请调整':'本场地容纳 '+CAP+' 人'+(+hc.value>=500?'；≥500人将增加保卫部审批':'');
    capHint.style.color=over?'#dc2626':'';
    return !over;
  }
  hc.oninput=checkCap;checkCap();
  document.getElementById('nextBtn').onclick=function(e){
    var errs=[];
    if(!checkCap()){errs.push('预估人数超过容纳人数');}
    if(document.getElementById('shotField').style.display===''&&!shotDone){errs.push('请上传审核通过截图');}
    if(document.getElementById('extFiles').style.display===''&&(!extDone['承诺书']||!extDone['清单'])){errs.push('请上传两份外接设备附件');}
    if(!picks[2].vals.length){errs.push('请选择活动负责老师');}
    var box=document.getElementById('errBox');
    if(errs.length){e.preventDefault();box.textContent='请先完善：'+errs.join('；');box.style.display='block';}else{box.style.display='none';}
  };
})();
</script>

</body>
</html>
