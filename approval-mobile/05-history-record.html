<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>任务详情 - 审批记录 - 智慧学工</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f5f5;color:#1e293b;max-width:375px;margin:0 auto;min-height:100vh;padding-bottom:24px}
a{text-decoration:none;color:inherit}
.header{background:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #f0f0f0;position:sticky;top:0;z-index:50}
.header .back{font-size:18px;color:#64748b}
.header h1{font-size:16px;font-weight:600;flex:1;text-align:center}
.top-info{background:#fff;padding:14px 16px;position:relative}
.flow-title{font-size:16px;font-weight:700;padding-right:60px;line-height:1.4}
.flow-meta{font-size:12.5px;color:#64748b;margin-top:6px}
.flow-admin{display:flex;align-items:center;gap:6px;font-size:12.5px;color:#64748b;margin-top:6px}
.flow-admin .admin-icon{width:20px;height:20px;border-radius:50%;background:#d97706;color:#fff;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600}
.detail-tabs{background:#fff;display:flex;border-bottom:1px solid #f0f0f0;position:sticky;top:44px;z-index:40}
.detail-tab{flex:1;text-align:center;padding:12px 0;font-size:14px;color:#94a3b8;font-weight:500;border-bottom:2px solid transparent}
.detail-tab.active{color:#d97706;font-weight:600;border-bottom-color:#d97706}

.record-list{padding:12px 16px}
.record-item{background:#fff;border-radius:10px;padding:14px 16px;margin-bottom:10px;border:1px solid #e2e8f0}
.record-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.record-avatar{width:32px;height:32px;border-radius:50%;background:#d97706;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.record-name{font-size:14px;font-weight:600}
.record-check{width:16px;height:16px;border-radius:50%;background:#059669;color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;margin-left:4px}
.record-meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#94a3b8}
</style>
</head>
<body>

<div class="header">
  <a class="back" href="05-history.html">←</a>
  <h1>任务详情</h1>
</div>

<div class="top-info">
  <div class="flow-title">206会议室的申请审核</div>
  <div class="flow-meta">当前任务：管理员审批</div>
  <div class="flow-admin"><div class="admin-icon">管</div>管理员</div>
</div>

<div class="detail-tabs">
  <a class="detail-tab" href="05-history-detail.html">表单详情</a>
  <a class="detail-tab active" href="05-history-record.html">审批记录</a>
</div>

<div class="record-list">
  <div class="record-item">
    <div class="record-top">
      <div class="record-avatar">管</div>
      <span class="record-name">管理员</span>
      <div class="record-check">✓</div>
    </div>
    <div class="record-meta">
      <span>管理员审批</span>
      <span>2026-04-10 09:15:00</span>
    </div>
  </div>
</div>

</body>
</html>
